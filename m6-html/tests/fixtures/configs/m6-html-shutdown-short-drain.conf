global_params = ["data/site.json"]
secrets_file  = "/nonexistent/path/secrets.toml"

# A one second drain deadline, so a test can watch shutdown give up on a
# request that never finishes.
[server]
drain_timeout_s = 1

[[route]]
path     = "/blog"
template = "templates/post-index.html.tmpl"
params   = ["content/posts/_index.json"]
