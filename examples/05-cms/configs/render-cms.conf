global_params = ["data/site.json"]

[[route]]
path  = "/contact"
cache = "no-store"

[[route]]
path  = "/cms"
cache = "no-store"

[[route]]
path  = "/cms/new"
cache = "no-store"

[[route]]
path  = "/cms/edit/{stem}"
cache = "no-store"

[[route]]
path  = "/api/drafts"
cache = "no-store"

[[route]]
path  = "/api/drafts/{stem}"
cache = "no-store"

[[route]]
path  = "/api/publish/{stem}"
cache = "no-store"

[[route]]
path  = "/api/unpublish/{stem}"
cache = "no-store"

# Publishing: after a change to the site's files the renderer reloads the
# backend that renders the blog (POST /genid on its socket) and then PURGEs
# every path from m6-http. The token carries the `purge-write` role, which the
# system config's `[registration] write_require` names. A missing or empty
# token file stops the service at start. In production, `ca_file` is left out
# and the system's certificate store is trusted.
[publish]
url        = "https://localhost:8443"
connect    = "127.0.0.1:8443"
token_file = "@M6_DEV_HOME@/05-cms/purge-write.token"
ca_file    = "@M6_DEV_HOME@/dev/ca.pem"
timeout_ms = 10000
reload     = "/tmp/m6/m6-html.sock"
