name: CI

# Pull requests, not pushes. Owner's call.
#
# The local checks are what a push goes through: `.githooks/pre-push` runs
# `check.sh`, and a merge into develop has already been through
# `tools/build-host-tests.sh` on a real Linux box, which tests strictly more than
# a runner can -- it has h2spec and h3spec installed and it is quiet enough to
# measure. Running the same ground again on every push spends runner minutes to
# re-confirm what the build host already said.
#
# A pull request is different: it is the point where someone else's change arrives
# and nothing local has vouched for it.
#
# WHAT IS NOT HERE: the performance check. A wall-clock measurement on a shared
# runner measures the runner, not the code. It stays on the build host, which
# is quiet and is where the recorded numbers in tools/perf-baseline.txt were
# taken. See CLAUDE.md, "Why the build host and not the laptop" -- the same
# argument applies twice over to a runner shared with the rest of the world.

on:
  pull_request:
    branches: [main, develop]
  # Manual, for re-running against a branch without opening a pull request.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: build, tests, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Enforceable as of 2026-09-13, when the tree was formatted. Before that
      # it would have rewritten 1,890 places: the code aligned struct fields by
      # hand and rustfmt undoes that. The owner's call was to run it and accept
      # the result, so now there is one answer to what the formatting is and no
      # one has to hold it in their head.
      - name: Formatting
        run: cargo fmt --all --check

      # Zero warnings, release and test builds, pre-existing included. This is
      # a standing rule and it is checked on Linux because that is where it
      # runs: three defects have only ever shown up there.
      - name: Release build, zero warnings
        run: |
          cargo build --workspace --release 2>&1 | tee build.log
          n=$(grep -c '^warning' build.log || true)
          echo "release warnings: $n"
          [ "$n" -eq 0 ] || { echo "::error::$n release warning(s)"; exit 1; }

      - name: Test build, zero warnings
        run: |
          cargo test --workspace --no-run 2>&1 | tee testbuild.log
          n=$(grep -c '^warning' testbuild.log || true)
          echo "test-build warnings: $n"
          [ "$n" -eq 0 ] || { echo "::error::$n test-build warning(s)"; exit 1; }

      # Capture in full, then report. Grepping the pipe drops the assertion
      # message and leaves a bare `panicked at <file>:<line>`, which names the
      # place and not the reason.
      - name: Test suite
        run: |
          cargo test --workspace > full.log 2>&1 || true
          grep -E '^test result:' full.log || true
          if grep -q '^failures:' full.log; then
            sed -n '/^failures:/,$p' full.log | head -80
            echo "::error::tests failed"
            exit 1
          fi

      # Clippy must be silent: `-D warnings`, no ceiling. It went to zero on
      # 2026-09-13 and is held there the same way rustc warnings are. A new
      # lint from a toolchain upgrade fails this, which is intended.
      - name: Clippy, silent
        run: ./tools/clippy.sh

  conformance:
    name: h1, h2, h3 conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # h1spec is delivered through uvx. On the build host this was installed
      # but not on the gate's PATH, and the resulting skip was silent, so the
      # four h1 targets went ungated for weeks on the one box that gated a
      # deploy. Install it explicitly and let the script fail if it is absent.
      - uses: astral-sh/setup-uv@v5

      - name: Install h2spec
        run: |
          curl -sSL -o h2spec.tar.gz \
            https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
          tar xzf h2spec.tar.gz
          sudo install -m755 h2spec /usr/local/bin/h2spec
          h2spec --version

      - name: Install h3spec
        run: |
          curl -sSL -o h3spec \
            https://github.com/kazu-yamamoto/h3spec/releases/download/v0.1.13/h3spec-linux-x86_64
          sudo install -m755 h3spec /usr/local/bin/h3spec

      - name: Build the servers under test
        run: cargo build --workspace --release

      # WITHOUT --allow-missing-tools, deliberately. All three testers are
      # installed above, so an absent one here is a failure and not a skip.
      # That flag exists for a laptop and is never a way to ship.
      - name: Conformance
        run: ./tools/conformance.sh

  dependencies:
    name: advisories, licences, duplicates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # m6 carried `# shellcheck disable=` directives for months and nothing ever ran
      # shellcheck, so the directives were decoration and the findings accumulated
      # unseen. When first run on 2026-09-16 there were 2 errors and 14 warnings, and
      # both errors were real: `for p in ${PIDS[@]:-}` in tools/conformance.sh, an
      # unquoted array expansion in the path that kills the harness's own child
      # processes, so an element containing whitespace would re-split and kill the
      # wrong thing or nothing at all.
      #
      # Warning level, not style: style is 100+ findings of preference across this
      # repo, and a gate that reports preference gets ignored, which is how the two
      # real errors survived.
      #
      # THE GIT HOOKS ARE SHELL AND ARE NOT NAMED `*.sh`. This found `*.sh` alone
      # until 2026-09-26, so `.githooks/pre-push` -- the script that decides what may
      # be pushed where, and the one shell file in this repository that runs on every
      # developer's machine -- was the one never checked. It had an unused-variable
      # warning sitting in it the whole time. A gate selecting its inputs by file
      # extension misses exactly the files that do not get one, and hooks never do.
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          FAIL=0
          COUNT=0
          while IFS= read -r f; do
            COUNT=$((COUNT + 1))
            if ! shellcheck -S warning "$f"; then FAIL=1; fi
          done < <(find . \( -name '*.sh' -o -path './.githooks/*' \) -type f -not -path './target/*' -not -path './.git/*')
          echo "checked $COUNT shell script(s)"
          exit $FAIL

  examples:
    name: the examples build and work
    runs-on: ubuntu-latest
    steps:
      # SIBLING CHECKOUTS, and the layout is load-bearing. The example renderer
      # crates depend on m6 by relative path (`../../../../m6/m6-core`), so
      # m6-examples and m6 have to sit beside each other. Checking either one out
      # at the workspace root breaks the path and the error is a missing
      # Cargo.toml several directories away from the cause.
      - uses: actions/checkout@v4
        with:
          path: m6

      - uses: actions/checkout@v4
        with:
          repository: mgrosvenor/m6-examples
          path: m6-examples

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            m6
            m6-examples

      - name: Build m6
        working-directory: m6
        run: |
          cargo build --workspace --release
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      # Zero warnings and silent clippy, the same standard as m6 itself: a reader
      # copies from these.
      - name: Examples build, zero warnings
        working-directory: m6-examples
        run: |
          cargo build --release 2>&1 | tee build.log
          n=$(grep -c '^warning' build.log || true)
          echo "examples release warnings: $n"
          [ "$n" -eq 0 ] || { echo "::error::$n warning(s) building the examples"; exit 1; }

      - name: Examples clippy, silent
        working-directory: m6-examples
        run: |
          cargo clippy --workspace --all-targets --release 2>&1 | tee clippy.log
          n=$(grep -c '^warning' clippy.log || true)
          [ "$n" -eq 0 ] || { echo "::error::$n clippy finding(s) in the examples"; exit 1; }

      - name: Examples unit tests
        working-directory: m6-examples
        run: |
          cargo test --workspace > full.log 2>&1 || true
          grep -E '^test result:' full.log || true
          if grep -q '^failures:' full.log; then
            sed -n '/^failures:/,$p' full.log | head -60
            echo "::error::example tests failed"
            exit 1
          fi

      # m6-file's config schema changed on 2026-09-12 and ten example configs
      # were left naming no handler, so the service exited 2 before binding and
      # every asset in every example returned 502 for two days. Parsing each
      # config with the real binary is a second of work and catches that outright.
      #
      # Every example is accounted for. 06-systemd is systemd units with no site
      # config, and 09-global-deployment's configs name /etc/letsencrypt paths for
      # five real cache nodes, so m6-http would reject them here for a missing
      # certificate rather than for anything wrong with them; its own integration
      # test covers it and ran above. An example with neither a config nor a
      # reason recorded here fails the job.
      # A FRESH CHECKOUT HAS NO CERTIFICATES, and the config parse needs them:
      # m6-http validates that tls_cert exists, so every example was rejected here
      # with "tls_cert file not found: .../keys/dev.pem" on CI's first ever run.
      # keys/ is gitignored — correctly, they are generated secrets — and each
      # example's dev.sh creates them on first run. This step does the same thing
      # dev.sh does, ahead of the parse.
      #
      # It passed on the build host only because rsync carried a developer's own
      # untracked keys/ directories. A check that depends on an untracked file is
      # not a check, which is the same lesson the mkcert fallback taught earlier.
      - name: Generate development certificates
        working-directory: m6-examples
        run: |
          for d in examples/*/; do
            [ -f "$d/dev.sh" ] || continue
            mkdir -p "$d/keys"
            if [ ! -f "$d/keys/dev.pem" ]; then
              openssl req -x509 -newkey rsa:2048 -sha256 -days 365 -nodes \
                -keyout "$d/keys/dev-key.pem" -out "$d/keys/dev.pem" \
                -subj "/CN=localhost" \
                -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" 2>/dev/null
            fi
            # Five examples also need an auth signing keypair, which their
            # setup.sh generates. Without it the parse fails with
            # "[auth].public_key file not found" — found by running this against a
            # genuinely fresh clone rather than a working tree that already had
            # them.
            if [ ! -f "$d/keys/auth.pub" ]; then
              # PKCS#8 (`genpkey`), not SEC1 (`ecparam -genkey`). m6-auth-server
              # refuses SEC1 with "invalid private key (tried EC and RSA):
              # InvalidKeyFormat" and exits, and pre-creating one here made dev.sh
              # skip generating a good one — 33 of 98 checks failed with 502s
              # because the auth server was never up.
              # `ec_param_enc:named_curve` too. It is the default for OpenSSL, so it
              # changes nothing here, but LibreSSL -- which is what macOS ships as
              # /usr/bin/openssl -- writes explicit curve parameters instead of the
              # prime256v1 OID, and the token signer refuses those with "JWT encode
              # error: InvalidEcdsaKey" at every login. Stated here so the two sides
              # of the check generate the same key.
              openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -pkeyopt ec_param_enc:named_curve -out "$d/keys/auth.pem" 2>/dev/null
              openssl pkey -in "$d/keys/auth.pem" -pubout -out "$d/keys/auth.pub" 2>/dev/null
              chmod 600 "$d/keys/auth.pem" 2>/dev/null || true
            fi
            echo "  $(basename "$d")"
          done
          # 09 keeps its certificates somewhere else.
          mkdir -p examples/09-global-deployment/certs

      - name: Every example's config parses
        working-directory: m6-examples
        run: |
          bad=0 unexplained=0
          for d in examples/*/; do
            name=$(basename "$d")
            case "$name" in
              data) continue ;;
              06-systemd) echo "  $name  not parsed: systemd units only, no site config"; continue ;;
              09-global-deployment) echo "  $name  not parsed: configs name letsencrypt paths; its integration test covers it"; continue ;;
            esac
            sys="$d/configs/system-dev.toml"
            [ -f "$sys" ] || sys="$d/site.toml"
            if [ ! -f "$sys" ]; then
              echo "  $name  NO CONFIG and no reason recorded for that"
              unexplained=$((unexplained + 1)); continue
            fi
            if out=$(m6-http "$(cd "$d" && pwd)" "$(cd "$(dirname "$sys")" && pwd)/$(basename "$sys")" --dump-config 2>&1 >/dev/null) && [ -z "$out" ]; then
              echo "  $name  ok"
            else
              echo "  $name  $(echo "$out" | head -1)"
              bad=$((bad + 1))
            fi
          done
          [ "$bad" -eq 0 ] || { echo "::error::$bad example config(s) rejected by m6-http"; exit 1; }
          [ "$unexplained" -eq 0 ] || { echo "::error::$unexplained example(s) with no config and no recorded reason"; exit 1; }

      # The one example that runs the whole stack: m6-http at the edge, m6-html,
      # m6-file, m6-md, m6-auth-server and a custom renderer. If this passes, the
      # parts work together.
      #
      # A FRESH CHECKOUT, which is the point: keys/ and the auth database are not
      # in git, so dev.sh generates a certificate with openssl (the runner has no
      # mkcert) and creates the admin user. That is exactly what a new reader gets
      # on step one of the README, and it is checked here rather than assumed.
      - name: Example 05, end to end over the running stack
        working-directory: m6-examples/examples/05-cms
        run: |
          M6="$GITHUB_WORKSPACE/m6" M6_NO_BROWSER=1 ./dev.sh --no-open > dev.log 2>&1 &
          for _ in $(seq 1 180); do
            code=$(curl -sk --http1.1 -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/ 2>/dev/null || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          if [ "$(curl -sk --http1.1 -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/ 2>/dev/null)" != "200" ]; then
            echo "--- dev.sh ---"; tail -40 dev.log
            echo "--- services ---"; tail -20 logs/*.log 2>/dev/null || true
            echo "::error::the 05-cms stack never answered in 180s"
            exit 1
          fi
          # `|| { dump; exit 1; }` — when the suite fails, the service logs are the
          # only way to tell a broken example from a broken backend. Without this,
          # 33 failures showing 502s said nothing about WHICH service was down.
          ./test.sh || { echo "--- service logs ---"; tail -30 logs/*.log 2>/dev/null; exit 1; }

      - name: Stop the stack
        if: always()
        working-directory: m6-examples/examples/05-cms
        run: |
          for pid in $(pgrep -f "$PWD" 2>/dev/null || true); do
            [ "$pid" = "$$" ] && continue
            kill "$pid" 2>/dev/null || true
          done

  changelog:
    name: the release says what changed and m6's docs say what is true
    # Only for a release: a pull request into main IS the release now, so this is
    # where `release.sh`'s changelog guard lives. It refused to cut a release
    # without an entry for the version; that script is gone, and the guard is not.
    #
    # THE HANDOVER CHECK BECAME A DOCS CHECK, 2026-09-26. Owner's rule from
    # 2026-09-25 stands unchanged: DOCS BEING UP TO DATE IS A FUNDAMENTAL PART OF
    # A RELEASE, not a follow-up to one. What changed is which documents it can
    # ask about. HANDOVER.md states which of one particular deployment's boxes
    # runs what, so it is not a public document and now lives in the private
    # deployment repository, where a workflow here cannot read it.
    #
    # THE RIGHT RESPONSE WAS TO WIDEN THIS, NOT DROP IT, and the first attempt
    # dropped it. m6 has its own docs and they go stale in exactly the same way:
    # on 2026-09-26 a sweep found docs/H2-PLAN.md leading with h3spec 37/49
    # thirteen days after it became 47/49, CONTRIBUTING.md describing a clippy
    # ceiling removed on 2026-09-13, and README.md saying a decision "gates a 1.0
    # release" twelve days after 1.0 was cut. The handover check would not have
    # caught one of them.
    #
    # What a workflow can honestly decide here is narrow: a changelog entry
    # exists, and the version is untagged. Freshness is judgement, and the release
    # checklist in .github/pull_request_template.md is where it is asked for, at
    # the moment the author knows the answer. That is the same mechanism the
    # handover check actually relied on: it never verified the handover was TRUE,
    # only that someone had opened it while they knew.
    #
    # A mechanical "no doc names a script that does not exist" check was written
    # for this job on 2026-09-26 and thrown away after being measured: 87
    # findings, of which about 80 were legitimate, because m6's docs reference the
    # deployment repository's scripts, the examples repository's, and scripts a
    # USER writes in their own project. A gate at that signal-to-noise gets muted,
    # which is how the two real errors in this repository's shell survived for
    # months. The narrow version of that check is a test, not a gate:
    # `every_script_offered_as_a_remedy_exists` in m6-core/tests/pre_push_hook.rs
    # covers the pre-push hook and this template, which is where it earns its
    # keep.
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CHANGELOG.md has an entry for this version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "workspace version: $v"
          if ! grep -qE "^## +\[?${v}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${v}' section."
            echo "A release says what changed in it: what changed, why it mattered,"
            echo "and how it was verified. Write the entry before merging to main."
            exit 1
          fi
          echo "found the entry:"
          sed -n "/^## \+\[\?${v}/,/^## /p" CHANGELOG.md | head -20

      - name: the version is not already tagged
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if git rev-parse "v$v" >/dev/null 2>&1; then
            echo "::error::v$v already exists as a tag. Bump the version in Cargo.toml."
            exit 1
          fi
          echo "v$v is free"

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from the workspace
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # Declaring an MSRV and not testing it is a claim, not a fact.
      - run: cargo check --workspace --all-targets
