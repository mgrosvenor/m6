# origin — system config (production)
# One m6-http instance handles both the public TLS edge and the H2C backbone.
#   bind     — public HTTPS on all interfaces for end users and Oceania GeoDNS target
#   h2c_bind — cleartext HTTP/2 on the WireGuard interface for cache nodes only
#              (WireGuard provides encryption; TLS would be redundant)
# internal_binds: the h2c listener is the backbone, so forwarded client addresses are trusted on it
# internal_peers: the cache nodes' backbone addresses. Any other peer is refused
# TLS files come from the unit's LoadCredential lines. The origin is the source of the
# site's generation ID, which it writes under the unit's StateDirectory.

[server]
bind     = "0.0.0.0:443"
tls_cert = "/run/credentials/m6-http-origin.service/tls-cert.pem"
tls_key  = "/run/credentials/m6-http-origin.service/tls-key.pem"
h2c_bind = "10.0.0.1:80"
internal_binds = ["10.0.0.1:80"]
internal_peers = ["10.0.0.2", "10.0.0.3", "10.0.0.4", "10.0.0.5", "10.0.0.6"]

[auth]
backend = "m6-auth-check"

[genid]
read_require  = "role:genid-read"
write_require = "role:genid-write"

[node]
name = "origin"
