global_params = ["data/site.json"]
secrets_file  = "/nonexistent/path/secrets.toml"

# Inert: m6-html runs its own loop and reads no worker pool. A request held in
# a partial body is one accepted connection, so a shutdown test always has work
# in flight. Kept until EL-6d refuses the key, as every service's config is
# updated then.
[thread_pool]
size       = 1
queue_size = 1

[[route]]
path     = "/blog"
template = "templates/post-index.html"
params   = ["content/posts/_index.json"]
