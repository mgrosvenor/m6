[package]
name    = "m6-http"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "m6-http"
path = "src/main.rs"

[[bin]]
name = "m6-bench"
path = "src/bench_main.rs"

[[bin]]
name = "m6-perf-ab"
path = "src/perf_ab_main.rs"

[[bin]]
name = "m6-bench-detail"
path = "src/bench_detail.rs"

[[bin]]
name = "bench-url-backend"
path = "src/bench_url_backend_main.rs"

# Three single-purpose handshake probes. One protocol each, one handshake per
# connection, strictly sequential, no requests and no charts -- the minimum that
# can check m6-http's own per-channel handshake figure on /perf against an
# independent measurement taken by our own client.
#
# Separate binaries rather than one with a --proto flag: each is a dozen lines
# over src/probe.rs, and the h3 figure spans a DIFFERENT thing from the other two
# (QUIC includes the transport round trip, TLS does not). Three commands make that
# hard to forget; one command with a flag invites averaging the output.
[[bin]]
name = "m6-probe-h1"
path = "src/probe_h1_main.rs"

[[bin]]
name = "m6-probe-h2"
path = "src/probe_h2_main.rs"

[[bin]]
name = "m6-probe-h3"
path = "src/probe_h3_main.rs"

[lib]
name = "m6_http_lib"
path = "src/lib.rs"

[features]
# Count every heap allocation the run loop makes, and log the count at stop.
# Off by default, and a plain build has neither the allocator nor the arm calls:
# `src/main.rs` gates all three on this feature, and m6-core exposes only its
# counting file through `alloc-count`. `tests/allocations.rs` reads the stop
# line of a binary built with this feature.
count-allocations = ["m6-core/alloc-count"]
# ALLOC-ATTR: dhat as the global allocator, so every allocation is attributed to
# a source line rather than just counted. It implies `count-allocations` so the
# binary keeps the same arm and stop lines, and it is off by default. This is
# measurement instrumentation only: no request path changes.
alloc-attribution = ["count-allocations", "dep:dhat"]

[dependencies]
# quiche, from our own fork, pinned BY REVISION and not by branch: a branch name
# would let the dependency change under a build that claims to be reproducible.
#
# The fork is quiche master plus two upstream pull requests that are open and
# unmerged, and it exists for one measured reason: released quiche scores 37/49
# on h3spec and this scores 47/49. Ten of the twelve failures are upstream bugs
# with fixes nobody has merged yet.
#
#   PR #2521, issue #2515   a transport error in the peer's first flight left the
#                           CONNECTION_CLOSE unsendable, so a malformed transport
#                           parameter got silence instead of the error naming it
#   PR #2575, issues #2526  non-zero reserved bits were accepted; there was no
#           and #2652       reserved-bit validation in packet.rs at all
#
# The two h3spec failures that remain are QPACK, which neither PR touches.
#
# WHEN UPSTREAM RELEASES THESE, drop the fork and go back to a tag. The full
# story, the recipe and every measurement are in tools/conformance-scores.txt.
#
# 0.29 also dropped the vendored-BoringSSL build: no `boringssl-vendored` feature
# and no cmake build step. The default feature is `boringssl-boring-crate`, so
# BoringSSL comes in through the `boring` crate, which vendors its own.
quiche         = { git = "https://github.com/mgrosvenor/quiche", rev = "efff6235" }
matchit        = "0.8"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
toml           = "0.8"
anyhow         = "1"
thiserror      = "1"
m6-core        = { path = "../m6-core", default-features = false }
jsonwebtoken   = "9"
glob           = "0.3"
bytes          = "1"
base64         = "0.22"
# ALLOC-ATTR only, behind `alloc-attribution`: the heap profiler that records a
# backtrace for every allocation and writes dhat-heap.json at exit.
dhat           = { version = "0.3", optional = true }
sha2           = "0.10"
httparse       = "1"
# Upstream, deliberately, despite RUSTSEC-2023-0084 and -0085.
#
# The advisory is real: `Decoder::decode` panics on some invalid input,
# `Option::unwrap()` on a `None` at decoder.rs:453. The maintained fork,
# `fluke-hpack` 0.3.1, has the identical panic at :505, so switching crates
# buys nothing.
#
# It is not reachable here. `check_hpack_block` runs `validate_hpack_block`
# over every block before it reaches the decoder and answers
# GOAWAY(COMPRESSION_ERROR) on anything malformed, so the decoder only ever
# sees blocks that have already been walked and found well-formed.
# `http2::hpack_robustness` is what keeps that true: it runs hostile blocks
# through the production sequence, validate then decode, and fails if any of
# them survives validation and panics.
hpack          = "0.3"
ahash          = "0.8"
# tls12 and logging reached release builds only through tokio-rustls's default
# features while the cold-start benchmark was a [[bin]]. Declare them here so
# the listener keeps the protocol versions and log records it had when
# tokio-rustls is a dev-dependency.
#
# aws-lc-rs is rustls's own default provider and the only one this tree builds.
# The build host measured it on Linux guests that hide ADX and SHA-NI: ring's
# X25519 falls back to its generic path at 83 us per handshake, aws-lc-rs has a
# non-ADX fast path at 56 us, and aws-lc-rs makes 0 getrandom calls per
# handshake against ring's 9. Nothing here needs ring, so it is not a second
# path: `builder()` resolves the provider from these features and there is
# exactly one provider to resolve.
rustls         = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
# rustls-pki-types rather than rustls-pemfile: that crate is unmaintained
# (RUSTSEC-2025-0134) and its advisory points at this one, which carries the same
# PEM code behind the `PemObject` trait. rustls already depends on it, so this is
# naming a dependency the tree already had rather than adding one.
rustls-pki-types = "1"
rustls-native-certs = "0.8"
rand           = "0.8"
httpdate       = "1"
# Decimal formatting without allocation on the response hot path: the cached
# hit writes status, age and content-length through itoa's stack buffer.
itoa           = "1"
# Non-blocking socket connect for the socket-backend upstreams. The same
# version m6-core already uses, so Cargo.lock gains no new crate.
socket2        = "0.6"

[dev-dependencies]
m6-core       = { path = "../m6-core", default-features = false, features = ["testkit"] }
tempfile      = "3"
# Setting a file's mtime is not in std, and the scratch-sweep test has to age a
# directory to prove the sweep looks at age at all. Already in the lock as a
# transitive dependency, so this adds no new source or licence for cargo-deny.
filetime      = "0.2"
anyhow        = "1"
criterion     = { version = "0.5", features = ["html_reports"] }
# The custom-harness tests speak libtest's protocol (`--list --format terse`,
# `--exact <name>`), which is what `nextest` lists and runs.
libtest-mimic = "0.8"
rcgen         = "0.13"
# The cold-start bench is the only user of these four. A [[bin]] cannot use
# dev-dependencies, so the bench is a [[bench]] and they live here.
h2             = "0.4"
tokio          = { version = "1", features = ["rt", "net", "io-util", "macros"] }
# The provider comes from this crate's rustls features, not from tokio-rustls.
# Its defaults enable `aws_lc_rs`, which with the `ring` this tree names would
# give rustls two providers and make `ClientConfig::builder()` panic. On the
# aws-lc-rs tree the same line leaves exactly one, its own.
tokio-rustls   = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
http           = "1"

[[bench]]
name    = "critical_path"
harness = false

[[bench]]
name    = "bench_coldstart"
harness = false

# The cached-hit allocation check, on the main thread so the counting allocator
# reads only the hit path's own allocations.
[[test]]
name = "alloc_cached_hit"
harness = false

# The generation-ID writers' allocation check, on the main thread for the same
# reason: one process-wide counter, one check at a time.
[[test]]
name = "genid_allocs"
harness = false

# The cache node's store-rule allocation check, on the main thread for the same
# reason: one process-wide counter, one check at a time.
[[test]]
name = "genid_cache_allocs"
harness = false

# The disk writer's queue allocation check, on the main thread for the same
# reason: one process-wide counter, one check at a time.
[[test]]
name = "disk_cache_allocs"
harness = false

# The disk cache's write and restart-read integration suite.
[[test]]
name = "disk_cache"

# The /traffic window's per-event allocation check, on the main thread for the
# same reason.
[[test]]
name = "traffic_window_alloc"
harness = false

# The per-request analytics line's allocation check. Its own binary so the
# counting allocator reads only what `record` allocated, with the analytics Sink
# opened first.
[[test]]
name = "analytics_allocs"
harness = false

# ALLOC-0: heap allocations per cached request, by row, read from the stop line
# of a binary built with the counting allocator. Needs the feature, so an
# ordinary `cargo test --workspace` neither builds nor runs it.
[[test]]
name = "allocations"
required-features = ["count-allocations"]

# ALLOC-ATTR: the same four rows with dhat as the allocator, at two request
# counts, writing one dhat-heap.json per server run. It needs both features, so
# an ordinary test run never builds it.
[[test]]
name = "alloc_attribution"
required-features = ["alloc-attribution"]
