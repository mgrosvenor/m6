[package]
name    = "m6-auth-cli"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "m6-auth-cli"

[dependencies]
m6-auth     = { path = "../m6-auth" }
toml        = "0.8"
anyhow      = "1"
rpassword   = "7"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

[dev-dependencies]
tempfile = "3"
