# m6-file registers one handler in code, `files`, and every route that uses it
# names it. A route naming a handler the binary does not have is fatal: the
# service exits 2 before binding.
#
# `{*relpath}` is the explicit wildcard. A bare trailing `{relpath}` matches one
# segment only, because making the last `{param}` span several segments would
# change what every other route means.

[[route]]
path    = "/assets/{*relpath}"
handler = "files"
root    = "assets/"
headers = [["Cross-Origin-Resource-Policy", "same-origin"]]

# Tail mode: serve log files from a byte offset, no caching.
# The browser JS polls GET /logs/tail/<name>.log?offset=N
# and reads the X-Log-End response header for the next offset.
[[route]]
path = "/logs/tail/{*relpath}"
handler = "files"
root = "logs/"
tail = true
