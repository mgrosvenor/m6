global_params = ["data/site.json"]
secrets_file  = "/nonexistent/path/secrets.toml"

[server]
# Short enough that a silent peer is let go during a test, long enough that a
# real request opened beside 64 silent ones is answered before any of them
# reaches its deadline.
read_timeout_s = 3

[[route]]
path     = "/"
template = "templates/home.html"
params   = ["content/pages/index.json"]
