      # h1_tls_miss_insert failed here while the local gate reported green.
      - name: Feature-gated tests, named explicitly
        if: ${{ !cancelled() && steps.testbuild.outputs.compiled == 'true' }}
        run: |
          ./tools/feature-gated-tests.sh
      - name: Opt-in core features, zero warnings and tests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          cargo test -p m6-core --lib --all-features --no-run 2>&1 | tee featbuild.log
          n=$(grep -c '^warning' featbuild.log || true)
          [ "$n" -eq 0 ] || { echo "::error::$n warning(s) building m6-core --all-features"; exit 1; }
          status=0
          { cargo test -p m6-core --lib --all-features && cargo test -p m6-core --doc --all-features; } > feat.log 2>&1 || status=$?
          grep -E '^test result:' feat.log || true
