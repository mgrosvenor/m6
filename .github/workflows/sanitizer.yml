name: Sanitisers

# The address and leak sanitisers, in a workflow of their own so the required
# checks in ci.yml are untouched until this job is promoted to one.
#
# It runs on pushes to develop and by hand. A pull request does not trigger it
# yet, because a finding in code that predates a pull request would block a
# merge that did not cause it.
#
# The triage rule, from issue #164:
#   A run that reports a leak or a memory fault in code older than this job is
#   evidence of a real defect. File one generic m6 issue per finding and add
#   `continue-on-error: true` to the job with the issue numbers named here.
#   Fixing those findings is separate work. No finding is fixed in this job.
#   There is no silent allowance: the job runs without that line until an
#   issue is on file.
#
# A sanitised run that cannot measure must fail, and it must not pass while
# measuring nothing. CLAUDE.md says this, and issue #166 says what a skip cost
# the conformance script. A failed nightly install, an absent sanitiser
# runtime and a rejected flag all fail this job in seconds, before the suite
# builds. The probe below compiles and runs a trivial program with the same
# flags as the suite, so the job cannot reach the suite with a sanitiser that
# is not there.
#
# The tests bind fixed loopback ports, so they run with --test-threads=1. The
# step prints its wall clock time. The first runs decide the 20-minute
# promotion budget: under it this job can be promoted to a required check,
# over it the job stays out of the merge gate and moves to a schedule that
# fails loudly.

on:
  push:
    branches: [develop]
  # Manual, for a branch or a re-run without waiting for a push to develop.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# One run per ref, as in ci.yml. A newer push replaces a run that is already
# superseded.
concurrency:
  group: sanitizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitizers:
    name: address and leak sanitisers
    runs-on: ubuntu-latest
    # Triage rule. If a run reports a leak or a memory fault in existing code,
    # file one generic m6 issue per finding and uncomment the next line with
    # those issue numbers in this comment. Do not leave it on without them.
    # continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Nightly toolchain and the Linux target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      # The runtime is the part most likely to be missing. The nightly
      # toolchain always exists by the time this step runs, because the step
      # above fails if it does not. The probe proves the sanitiser runtime
      # links for this target and loads when the binary starts, which is the
      # difference between a check and a skip.
      - name: The sanitiser runtime is present
        run: |
          rustc +nightly --version
          rustup target list --installed --toolchain nightly
          probe="$RUNNER_TEMP/sanitizer-probe"
          printf 'fn main() {}\n' > "$probe.rs"
          if ! rustc +nightly -Z sanitizer=address,leak --target x86_64-unknown-linux-gnu "$probe.rs" -o "$probe"; then
            echo "::error::nightly rejected -Z sanitizer=address,leak for x86_64-unknown-linux-gnu"
            echo "The sanitiser is unavailable. This job fails rather than pass without it."
            exit 1
          fi
          if ! "$probe"; then
            echo "::error::the sanitiser runtime did not load"
            exit 1
          fi
          echo "the sanitiser runtime linked and loaded"

      # The command from issue #164, with the serial flag the tests need. This
      # is the measurement. Everything above exists to make sure it runs.
      - name: Tests under the address and leak sanitisers
        env:
          # Rustdoc compiles each doctest as a separate crate and links the
          # instrumented rlib, so it needs the same flag. Without it the
          # doctest link fails on undefined sanitiser symbols, and cargo test
          # runs doctests even with an explicit host --target.
          RUSTFLAGS: "-Z sanitizer=address,leak"
          RUSTDOCFLAGS: "-Z sanitizer=address,leak"
        run: |
          time cargo +nightly test --workspace --target x86_64-unknown-linux-gnu -- --test-threads=1
