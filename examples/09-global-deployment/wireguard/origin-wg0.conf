# origin — WireGuard hub
# Replace ORIGIN_PRIVATE_KEY and all PUBLIC_KEY placeholders with real keys.
# Generate keys: wg genkey | tee privatekey | wg pubkey > publickey

[Interface]
PrivateKey = <ORIGIN_PRIVATE_KEY>
Address    = 10.0.0.1/24
ListenPort = 51820

# Firewall: allow UDP 51820 inbound on origin's public interface.
# PostUp   = ufw allow 51820/udp
# PostDown = ufw delete allow 51820/udp

[Peer]
# edge-a
PublicKey  = <EDGE_A_PUBLIC_KEY>
AllowedIPs = 10.0.0.2/32

[Peer]
# edge-b
PublicKey  = <EDGE_B_PUBLIC_KEY>
AllowedIPs = 10.0.0.3/32

[Peer]
# edge-c
PublicKey  = <EDGE_C_PUBLIC_KEY>
AllowedIPs = 10.0.0.4/32

[Peer]
# edge-d
PublicKey  = <EDGE_D_PUBLIC_KEY>
AllowedIPs = 10.0.0.5/32

[Peer]
# edge-e
PublicKey  = <EDGE_E_PUBLIC_KEY>
AllowedIPs = 10.0.0.6/32
