# render-admin config
# These keys are read by load_state() via the m6-render user_config dict.

socket   = "/tmp/m6/render-admin.sock"

# Path to the m6-http JSON-lines log (used for /api/admin/perf and /api/admin/logs).
log_file = "@M6_DEV_HOME@/11-admin-dashboard/m6-http-admin.log"

# Path to the site's own site.toml (used for config read/write/touch and the topology view).
site_toml = "site.toml"

# Path to the system config m6-http is started with (its [server].bind gives the
# bench targets and the bind shown by /api/admin/backends).
system_toml = "configs/system-dev.toml"

# How many "periodic stats" history entries to return by default.
perf_history = 60

# How many "request complete" log entries to sample for per-route stats.
routes_sample = 10000

# Default number of log lines to return.
log_tail_default = 100

# Path to the m6-bench binary.
bench_bin = "m6-bench"

# Default bench duration and concurrency.
bench_duration_secs = 10
bench_concurrency   = 50

# Services that can be restarted via POST /api/admin/services/{name}/restart.
# Each entry needs a name and a PID file path.
[[services]]
name     = "m6-http"
pid_file = "@M6_DEV_HOME@/11-admin-dashboard/m6-http-admin.pid"

[[services]]
name     = "render-admin"
pid_file = "@M6_DEV_HOME@/11-admin-dashboard/render-admin.pid"

# Publishing: after a change to the site's files the renderer sends
# `POST /genid` to m6-http. m6-http reloads every backend, flushes its cache and
# advances the site's generation, so the change shows without a restart. The
# token carries the `genid-write` role, which the system config's
# `[genid] write_require` names (dev-token.sh writes it). A missing or
# empty token file stops the service at start. In production, `ca_file` is
# left out and the system's certificate store is trusted.
[genid]
url        = "https://localhost:8444/genid"
connect    = "127.0.0.1:8444"
token_file = "@M6_DEV_HOME@/11-admin-dashboard/genid-write.token"
ca_file    = "@M6_DEV_HOME@/dev/ca.pem"
timeout_ms = 10000
