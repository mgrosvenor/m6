[package]
name    = "render-admin"
version = "0.1.0"
edition = "2021"

[lib]
name = "render_admin"
path = "src/lib.rs"

[[bin]]
name = "render-admin"
path = "src/main.rs"

[dependencies]
m6-core     = { path = "../../../../m6/m6-core" }
genid-publisher = { path = "../../common/genid-publisher" }
sysinfo     = "0.31"
serde_json  = "1"
toml        = "0.8"
anyhow      = "1"
uuid        = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
