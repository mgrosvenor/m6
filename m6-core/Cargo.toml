[package]
name    = "m6-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "m6_core"

[features]
# The shared integration-test harness. Off by default so no production binary
# links it; enable it from a crate's [dev-dependencies] entry.
testkit = []

# Request/response extras, off by default so a binary links only what it uses.
# These mirror the m6-render features they moved from, and m6-render forwards
# its own to these during the Phase 5/6 transition.
multipart = ["dep:multer", "dep:tokio", "dep:bytes", "dep:futures-util"]
flash     = ["dep:hmac", "dep:sha2"]
csrf      = []

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
anyhow     = "1"
thiserror  = "1"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
tracing-appender   = "0.2"
nix        = { version = "0.27", features = ["signal"] }
httparse   = "1"
httpdate   = "1"
rand       = "0.8"
libc       = "0.2"
minify-html = "0.15"
minify-js   = "0.5"
brotli      = "6"
flate2      = "1"
base64      = "0.22"
filetime    = "0.2"

multer        = { version = "3",    optional = true }
tokio         = { version = "1",    optional = true, features = ["rt", "macros"] }
bytes         = { version = "1",    optional = true }
futures-util  = { version = "0.3",  optional = true }
hmac          = { version = "0.12", optional = true }
sha2          = { version = "0.10", optional = true }

[dev-dependencies]
tempfile = "3"
