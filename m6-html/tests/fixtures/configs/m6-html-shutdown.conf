global_params = ["data/site.json"]
secrets_file  = "/nonexistent/path/secrets.toml"

# One worker and a queue of one, so a request that blocks in a body read holds
# the worker and a second request waits behind it. Neither is refused, so a
# shutdown test always has a request in flight.
[thread_pool]
size       = 1
queue_size = 1

[[route]]
path     = "/blog"
template = "templates/post-index.html"
params   = ["content/posts/_index.json"]
