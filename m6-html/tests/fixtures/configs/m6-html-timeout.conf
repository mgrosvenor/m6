global_params = ["data/site.json"]
secrets_file  = "/nonexistent/path/secrets.toml"

# A deliberately tiny pool, so a handful of silent peers is the whole of it.
[thread_pool]
size       = 2
queue_size = 2

[server]
# Short enough that the tests do not sit for the 30 second default, long enough
# that a saturated pool can actually be observed before it drains.
#
# It was 1, and that is too short to test with: a silent peer is released after
# the deadline, so with a one second deadline the pool un-saturates faster than
# a probe that is itself queued behind it can report the 503. The fix under test
# was defeating the precondition of the test.
read_timeout_s = 3

[[route]]
path     = "/"
template = "templates/home.html"
params   = ["content/pages/index.json"]
