[package]
name    = "m6-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "m6_core"

[features]
# Templating and minification are on by default because core is the box of
# blocks a service is assembled from, and a service that renders or minifies
# should get them by depending on core. A service that uses neither takes core
# with `default-features = false` and, built on its own (`-p`, `cargo install`),
# links no template engine, Markdown engine or CSS engine. A workspace build
# unifies features, and m6-html turns both on there.
default = ["templates", "minify"]
# The shared integration-test harness. Off by default so no production binary
# links it; enable it from a crate's [dev-dependencies] entry.
testkit = []

# Request/response extras, off by default so a binary links only what it uses.
# `multipart` gates the multipart body parser and the streaming types it needs.
multipart = ["dep:multer", "dep:tokio", "dep:bytes", "dep:futures-util"]

# Tera templating, with comrak for Markdown. Without it `App` uses
# `NoTemplates`, and a route that names a template is a configuration error.
templates = ["dep:tera", "dep:comrak"]

# The minifiers for HTML, CSS, JavaScript and JSON, run on the response path
# when the config enables them. minify-html brings a full CSS engine, which a
# service that never minifies should not link. Without the feature, a config
# that enables minification fails to load and names it.
minify    = ["dep:minify-html", "dep:minify-js"]
flash     = ["dep:hmac", "dep:sha2"]
csrf      = []

# Blocks a service assembles itself from. Off by default because not every
# service sends mail or makes outbound requests, on by name when it does.
# m6-core is meant to be the only crate a service links, so these live here
# rather than being something each service rediscovers.
email       = ["dep:lettre"]
http-client = ["dep:ureq"]

# One SQLite file with house settings, versioned migrations and an append-only
# table rule. Off by default, so a service that does not use it links nothing
# new. It uses the same rusqlite version and `bundled` feature as the rest of
# the workspace, so the lockfile gains no package. Nothing in the workspace
# turns it on, so CI tests and lints m6-core with --all-features.
sqlite = ["dep:rusqlite"]

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
anyhow     = "1"
thiserror  = "1"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
tracing-appender   = "0.2"
nix        = { version = "0.31", features = ["signal", "poll", "inotify", "event", "fs"] }
socket2    = "0.6"
httparse   = "1"
httpdate   = "1"
rand       = "0.8"
libc       = "0.2"
brotli      = "6"
flate2      = "1"
base64      = "0.22"
filetime    = "0.2"
chrono      = { version = "0.4", features = ["serde"] }
lru         = "0.18"
slug        = "0.1"
# The running binary's identity, reported through /perf. md5 and not sha2,
# which is already here behind `flash`, because the value has to be the SAME
# NUMBER a deployment's own tooling compares, and `md5sum` is what that tooling
# reaches for. A second hash of the same bytes under a different algorithm
# gives an operator two numbers both called "the binary" and answers none of
# the questions this is for. Not a security claim: nothing here authenticates a
# binary, it identifies one. Same RustCrypto family as sha2, so it shares
# `digest` and adds one crate.
md-5        = "0.10"

minify-html   = { version = "0.15", optional = true }
minify-js     = { version = "0.5",  optional = true }
tera          = { version = "1",    optional = true }
comrak        = { version = "0.21", optional = true, default-features = false }
multer        = { version = "3",    optional = true }
tokio         = { version = "1",    optional = true, features = ["rt", "macros"] }
bytes         = { version = "1",    optional = true }
futures-util  = { version = "0.3",  optional = true }
lettre        = { version = "0.11", optional = true, features = ["smtp-transport", "native-tls"] }
ureq          = { version = "2",    optional = true, features = ["json"] }
hmac          = { version = "0.12", optional = true }
sha2          = { version = "0.10", optional = true }
rusqlite      = { version = "0.31", optional = true, features = ["bundled"] }

[dev-dependencies]
tempfile  = "3"
criterion = { version = "0.5", features = ["html_reports"] }
# For `tls`'s tests, which parse real certificates rather than a fixture: a
# checked-in certificate expires, and a test that starts failing on a date is a
# test that gets deleted. `time` comes with them because rcgen's `not_after` is
# a `time::OffsetDateTime` and rcgen does not re-export the type.
rcgen     = "0.13"
time      = "0.3"

# Its own `main`: the signal mask is inherited only by threads created after
# `block()`, and the libtest harness has already started one by the time a test
# function runs.
[[test]]
name    = "log_reopen"
harness = false

# Its own `main`: an `App` reads its site directory and config path from the
# process's arguments, so the test re-runs itself as the service.
[[test]]
name    = "on_reload"
harness = false

[[bench]]
name    = "critical_path"
harness = false
