[package]
name    = "m6-file"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "m6-file"

[lib]
name = "m6_file_lib"
path = "src/lib.rs"

[dependencies]
serde_json  = "1"
m6-core     = { path = "../m6-core", default-features = false, features = ["minify"] }
toml        = "0.8"
serde       = { version = "1", features = ["derive"] }
anyhow      = "1"
mime_guess  = "2"
httpdate    = "1"

[dev-dependencies]
m6-core       = { path = "../m6-core", default-features = false, features = ["testkit"] }
tempfile  = "3"
criterion = { version = "0.5", features = ["html_reports"] }
# A test sets a 64 KiB receive buffer, which std does not expose.
socket2   = "0.6"

[[bench]]
name    = "critical_path"
harness = false
