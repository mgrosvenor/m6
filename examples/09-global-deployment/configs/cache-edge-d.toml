# edge-d cache node
# TLS files come from the unit's LoadCredential lines.

[server]
bind     = "0.0.0.0:443"
tls_cert = "/run/credentials/m6-http-cache.service/tls-cert.pem"
tls_key  = "/run/credentials/m6-http-cache.service/tls-key.pem"

[node]
name = "edge-d"

# The cache node registers with the origin over the control channel and
# holds that one connection open for purges.
[registration]
origin = "10.0.0.1:81"
