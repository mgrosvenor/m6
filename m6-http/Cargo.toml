[package]
name    = "m6-http"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "m6-http"
path = "src/main.rs"

[[bin]]
name = "m6-bench"
path = "src/bench_main.rs"

[[bin]]
name = "m6-bench-detail"
path = "src/bench_detail.rs"

[[bin]]
name = "m6-bench-coldstart"
path = "src/bench_coldstart.rs"

[[bin]]
name = "bench-url-backend"
path = "src/bench_url_backend_main.rs"

# Three single-purpose handshake probes. One protocol each, one handshake per
# connection, strictly sequential, no requests and no charts -- the minimum that
# can check m6-http's own per-channel handshake figure on /perf against an
# independent measurement taken by our own client.
#
# Separate binaries rather than one with a --proto flag: each is a dozen lines
# over src/probe.rs, and the h3 figure spans a DIFFERENT thing from the other two
# (QUIC includes the transport round trip, TLS does not). Three commands make that
# hard to forget; one command with a flag invites averaging the output.
[[bin]]
name = "m6-probe-h1"
path = "src/probe_h1_main.rs"

[[bin]]
name = "m6-probe-h2"
path = "src/probe_h2_main.rs"

[[bin]]
name = "m6-probe-h3"
path = "src/probe_h3_main.rs"

[lib]
name = "m6_http_lib"
path = "src/lib.rs"

[dependencies]
# quiche, from our own fork, pinned BY REVISION and not by branch: a branch name
# would let the dependency change under a build that claims to be reproducible.
#
# The fork is quiche master plus two upstream pull requests that are open and
# unmerged, and it exists for one measured reason: released quiche scores 37/49
# on h3spec and this scores 47/49. Ten of the twelve failures are upstream bugs
# with fixes nobody has merged yet.
#
#   PR #2521, issue #2515   a transport error in the peer's first flight left the
#                           CONNECTION_CLOSE unsendable, so a malformed transport
#                           parameter got silence instead of the error naming it
#   PR #2575, issues #2526  non-zero reserved bits were accepted; there was no
#           and #2652       reserved-bit validation in packet.rs at all
#
# The two h3spec failures that remain are QPACK, which neither PR touches.
#
# WHEN UPSTREAM RELEASES THESE, drop the fork and go back to a tag. The full
# story, the recipe and every measurement are in tools/conformance-scores.txt.
#
# 0.29 also dropped the vendored-BoringSSL build: no `boringssl-vendored` feature
# and no cmake build step. The default feature is `boringssl-boring-crate`, so
# BoringSSL comes in through the `boring` crate, which vendors its own.
quiche         = { git = "https://github.com/mgrosvenor/quiche", rev = "4bbba71e3cf2bd9e8bcc48f2954658c57c5ed434" }
matchit        = "0.8"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
toml           = "0.8"
anyhow         = "1"
thiserror      = "1"
m6-core        = { path = "../m6-core" }
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
jsonwebtoken   = "9"
glob           = "0.3"
bytes          = "1"
base64         = "0.22"
sha2           = "0.10"
httparse       = "1"
# Upstream, deliberately, despite RUSTSEC-2023-0084 and -0085.
#
# The advisory is real: `Decoder::decode` panics on some invalid input,
# `Option::unwrap()` on a `None` at decoder.rs:453. The maintained fork,
# `fluke-hpack` 0.3.1, has the identical panic at :505, so switching crates
# buys nothing.
#
# It is not reachable here. `check_hpack_block` runs `validate_hpack_block`
# over every block before it reaches the decoder and answers
# GOAWAY(COMPRESSION_ERROR) on anything malformed, so the decoder only ever
# sees blocks that have already been walked and found well-formed.
# `http2::hpack_robustness` is what keeps that true: it runs hostile blocks
# through the production sequence, validate then decode, and fails if any of
# them survives validation and panics.
hpack          = "0.3"
ahash          = "0.8"
libc           = "0.2"
rustls         = { version = "0.23", default-features = false, features = ["ring", "std"] }
# rustls-pki-types rather than rustls-pemfile: that crate is unmaintained
# (RUSTSEC-2025-0134) and its advisory points at this one, which carries the same
# PEM code behind the `PemObject` trait. rustls already depends on it, so this is
# naming a dependency the tree already had rather than adding one.
rustls-pki-types = "1"
rustls-native-certs = "0.8"
webpki-roots   = "0.26"
rand           = "0.8"
h2             = "0.4"
tokio          = { version = "1", features = ["rt", "net", "io-util", "macros"] }
tokio-rustls   = "0.26"
http           = "1"
httpdate       = "1"

[target.'cfg(target_os = "linux")'.dependencies]
inotify = "0.10"

[dev-dependencies]
m6-core       = { path = "../m6-core", features = ["testkit"] }
tempfile      = "3"
anyhow        = "1"
criterion     = { version = "0.5", features = ["html_reports"] }
rcgen         = "0.13"

[[bench]]
name    = "critical_path"
harness = false
