[package]
name    = "m6-render"
version = "0.1.0"
edition = "2021"

[lib]
name = "m6_render"

[features]
default     = []
email       = ["dep:lettre"]
http-client = ["dep:ureq"]
# These forward to m6-core, which owns Request/Response as of Phase 5. The
# local deps that remain are the ones app.rs still uses directly.
multipart   = ["m6-core/multipart"]
flash       = ["m6-core/flash", "dep:hmac", "dep:sha2"]
csrf        = ["m6-core/csrf", "dep:rand"]

[dependencies]
tera       = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
comrak     = { version = "0.21", default-features = false }
slug       = "0.1"
anyhow     = "1"
thiserror  = "1"
m6-core    = { path = "../m6-core" }
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
nix        = { version = "0.27", features = ["signal", "poll"] }
lru        = "0.16"
chrono     = { version = "0.4", features = ["serde"] }
base64     = "0.22"
filetime   = "0.2"
httpdate   = "1"          # Last-Modified formatting; same version m6-file uses
libc       = "0.2"

lettre        = { version = "0.11", optional = true, features = ["smtp-transport", "native-tls"] }
ureq          = { version = "2",    optional = true, features = ["json"] }
hmac          = { version = "0.12", optional = true }
sha2          = { version = "0.10", optional = true }
rand          = { version = "0.8",  optional = true }

[dev-dependencies]
tempfile  = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "critical_path"
harness = false
