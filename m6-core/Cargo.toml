[package]
name    = "m6-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
# `examples/echo.rs` and `examples/echo_tls.rs` are declared as `[[bin]]`
# targets below, not examples, so `cargo test --test echo_example` builds them.
autoexamples = false

[lib]
name = "m6_core"

[features]
# Templating and minification are on by default because core is the box of
# blocks a service is assembled from, and a service that renders or minifies
# should get them by depending on core. A service that uses neither takes core
# with `default-features = false` and, built on its own (`-p`, `cargo install`),
# links no template engine, Markdown engine or CSS engine. A workspace build
# unifies features, and m6-html turns both on there.
default = ["templates", "minify"]
# The shared integration-test harness. Off by default so no production binary
# links it; enable it from a crate's [dev-dependencies] entry.
testkit = ["alloc-count", "dep:rustls-pki-types"]
# The counting allocator on its own, without the rest of the harness, so a
# service binary can install it and count its own loop's allocations. ALLOC-0's
# m6-http `count-allocations` feature turns this on. Off by default and never in
# a plain build of a service.
alloc-count = []
# Record a backtrace per allocation, so a test can say where one request's
# allocations come from. Test instrumentation, off by default: no release build
# and no ordinary test build compiles the recording code, and only the
# diagnostic `alloc_sites` target asks for it.
alloc-trace = []

# Request/response extras, off by default so a binary links only what it uses.
# `multipart` gates the multipart body parser and the streaming types it needs.
multipart = ["dep:multer", "dep:bytes", "dep:futures-util", "dep:futures-executor"]

# Tera templating, with comrak for Markdown. Without it a service passes
# `NoTemplates`, and a route that names a template is a configuration error.
templates = ["dep:tera", "dep:comrak"]

# The minifiers for HTML, CSS, JavaScript and JSON, run on the response path
# when the config enables them. minify-html brings a full CSS engine, which a
# service that never minifies should not link. Without the feature, a config
# that enables minification fails to load and names it.
minify    = ["dep:minify-html", "dep:minify-js"]
flash     = ["dep:hmac"]
csrf      = []

# Blocks a service assembles itself from. Off by default because not every
# service sends mail or makes outbound requests, on by name when it does.
# m6-core is meant to be the only crate a service links, so these live here
# rather than being something each service rediscovers. Neither blocks: `email`
# is an SMTP client the service's own loop drives (`email::{Relay, Smtp}`) and
# `http-client` is a form POST on `client::Upstream` (`client::Endpoint`).
email       = ["dep:lettre"]
http-client = ["dep:url"]

# One SQLite file with house settings, versioned migrations and an append-only
# table rule. Off by default, so a service that does not use it links nothing
# new. It uses the same rusqlite version and `bundled` feature as the rest of
# the workspace, so the lockfile gains no package. Nothing in the workspace
# turns it on, so CI tests and lints m6-core with --all-features.
sqlite = ["dep:rusqlite"]

[dependencies]
# The platform layer: the one crate that knows the operating system, re-exported
# as `m6_core::platform` so a service names nothing below m6-core.
m6-platform = { path = "../m6-platform" }
# The buffered JSONL logger. Re-exported as `m6_core::log`, so a service links
# only m6-core.
m6-log = { path = "../m6-log" }
# `server::bind_tcp_reuseaddr` and the TCP listener options.
socket2    = "0.6"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
anyhow     = "1"
thiserror  = "1"
httparse   = "1"
httpdate   = "1"
rand       = "0.8"
brotli      = "6"
flate2      = "1"
base64      = "0.22"
chrono      = { version = "0.4", features = ["serde"] }
lru         = "0.18"
slug        = "0.1"
# The running binary's identity, reported through /perf. md5 and not sha2,
# which is already here for the certificate fingerprint, because the value has
# to be the SAME NUMBER a deployment's own tooling compares, and `md5sum` is
# what that tooling reaches for. A second hash of the same bytes under a
# different algorithm gives an operator two numbers both called "the binary"
# and answers none of the questions this is for. Not a security claim: nothing
# here authenticates a binary, it identifies one. Same RustCrypto family as
# sha2, so it shares `digest` and adds one crate.
md-5        = "0.10"
# DNS messages for the monitor's crawler check. Only the message codec is
# wanted: the socket and the loop are m6's, and `std` is the whole feature set
# this crate needs.
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
resolv-conf   = { version = "0.7", default-features = false }

minify-html   = { version = "0.15", optional = true }
minify-js     = { version = "0.5",  optional = true }
tera          = { version = "1",    optional = true }
comrak        = { version = "0.21", optional = true, default-features = false }
multer        = { version = "3",    optional = true }
bytes         = { version = "1",    optional = true }
futures-util  = { version = "0.3",  optional = true }
# Drive multer's async field stream on the current thread without building a
# tokio runtime per upload.
futures-executor = { version = "0.3", optional = true }
# lettre's pieces that do not touch a socket: the message builder, the SMTP
# commands, the reply parser and the extension and authentication types. Its
# transport, pool and native-tls features go, because m6-core's own client
# drives the conversation. `hostname` keeps the EHLO name.
lettre        = { version = "0.11", optional = true, default-features = false, features = ["builder", "smtp-transport", "hostname"] }
# `client::Endpoint` parses a URL and encodes a form. Behind `http-client`.
url           = { version = "2",    optional = true }
hmac          = { version = "0.12", optional = true }
# The certificate fingerprint, reported through /perf, is SHA-256 of the DER a
# node is serving. Not `md-5` above: that hash is for a binary's identity,
# where the number has to match `md5sum` on the artefact, and a certificate
# fingerprint has the same requirement with a different tool -- `openssl x509
# -fingerprint -sha256` is what an operator compares, so the number has to be
# SHA-256. It is also the collision-resistant choice for a value the monitor
# uses to decide two nodes serve the same certificate. Already in m6-http's
# tree and in the lockfile, so the build gains no package.
sha2          = "0.10"
rusqlite      = { version = "0.41", optional = true, features = ["bundled", "fallible_uint"] }
# `client::Upstream` and the TLS echo program use rustls with exactly the
# features m6-http names, so the workspace builds one rustls, not two.
# aws-lc-rs is rustls's default provider and the only one this tree names; see
# m6-http/Cargo.toml for the Linux measurement behind the choice.
rustls          = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", optional = true }
# The host's own certificate store, for `client::system_roots`. The same
# version m6-http uses, so the workspace links one of it and the lock gains no
# package.
rustls-native-certs = "0.8"

[dev-dependencies]
tempfile  = "3"
filetime  = "0.2"
criterion = { version = "0.5", features = ["html_reports"] }
# The custom-harness tests speak libtest's protocol (`--list --format terse`,
# `--exact <name>`), which is what `nextest` lists and runs.
libtest-mimic = "0.8"
# For `tls`'s tests, which parse real certificates rather than a fixture: a
# checked-in certificate expires, and a test that starts failing on a date is a
# test that gets deleted. `time` comes with them because rcgen's `not_after` is
# a `time::OffsetDateTime` and rcgen does not re-export the type.
rcgen     = "0.13"
time      = "0.3"

# The echo programs prove the loop serves with no heap allocation outside table
# growth. They use the counting allocator behind `testkit`. They are `[[bin]]`
# targets (not `[[example]]`) so `cargo test --test echo_example` builds them and
# exposes them as `CARGO_BIN_EXE_echo` / `CARGO_BIN_EXE_echo_tls`; the test
# starts them as child processes over the wire.
[[bin]]
name    = "echo"
path    = "examples/echo.rs"
required-features = ["testkit"]

[[bin]]
name    = "echo_tls"
path    = "examples/echo_tls.rs"
required-features = ["testkit"]

# Its own `main`: the signal mask is inherited only by threads created after
# `block()`, and the libtest harness has already started one by the time a test
# function runs.
[[test]]
name    = "reopen_moves_new_lines"
harness = false

# The three allocation checks (`Timeouts`, `Slots`, `LoopTrace`), each on the
# main thread so the count is the checks' own.
[[test]]
name    = "event_allocs"
harness = false
required-features = ["testkit"]

# The page area's allocation rules (I-217, I-223): a page under the start
# allocates nothing for the area, an oversized one grows it once, and the next
# pages of any size allocate nothing for it. Its own `main`, as `event_allocs`.
[[test]]
name    = "limit_page_allocs"
harness = false
required-features = ["testkit"]

# `client::Upstream`'s no-allocation proof: a thousand plain requests allocate
# nothing. Its own `main` so the counting allocator is installed before any
# thread, and the count is only this binary's own.
[[test]]
name    = "upstream_no_alloc"
harness = false
required-features = ["testkit"]

# `h1::ServerConn`'s proof: keep-alive requests allocate nothing, a pipelined
# pair is served from the buffer, a large request's buffer is cut back, and a
# streamed body is pumped a chunk per writable turn. Its own `main`, so the
# counting allocator is installed before any thread starts.
[[test]]
name    = "server_conn"
harness = false
required-features = ["testkit"]

# The page path's allocation baseline, for ALLOC-3: a hundred requests through
# a `Site` and a `ServerConn`, each after the first allocating the same number
# of times. Its own `main`, as `server_conn`'s.
[[test]]
name    = "site_allocs"
harness = false
required-features = ["testkit"]

# The page path's per-request allocation counts, so one that comes back is
# seen: an identity response is not copied for a compression that never
# happens, and a handler request stays within its budget. Its own `main`, as
# `site_allocs`'s.
[[test]]
name    = "request_allocs"
harness = false
required-features = ["testkit"]

# Where one measured request's allocations come from: the same windows
# `request_allocs` counts, with `alloc_count`'s backtrace recording on. It
# prints a grouped list for a diff between two trees, and is a diagnostic, not
# a gate.
[[test]]
name    = "alloc_sites"
harness = false
required-features = ["testkit", "alloc-trace"]

# The service that sends mail from its own loop: a success, a reported failure
# and the loop's 504, each against a loopback SMTP stub. Its own `main` so the
# service loop owns its thread, as a real service does.
[[test]]
name    = "email_in_the_loop"
harness = false
required-features = ["email", "testkit"]

# `email::Smtp`'s allocation proof: the slot's own buffers, steps and command
# bytes allocate nothing; lettre's message bytes and reply parse are counted
# separately. Its own `main`, so the counting allocator is this binary's own.
[[test]]
name    = "email_allocs"
harness = false
required-features = ["email", "testkit"]

[[bench]]
name    = "critical_path"
harness = false

# ALLOC-0's guard on the counting allocator itself: armed, one
# `Vec::with_capacity(10)` counts one call and ten bytes, a disarmed thread
# counts nothing, another thread's allocation is not this thread's, and `now()`
# still counts every thread's. Its own `main`, so the allocator is installed
# before any thread and the count is this binary's own.
[[test]]
name    = "alloc_count_armed"
harness = false
required-features = ["alloc-count"]
