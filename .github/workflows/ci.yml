name: CI

# Pull requests AND the branches that matter, as of 2026-09-26.
#
# This said "pull requests, not pushes" and gave a reason that had stopped being
# true: that a push already goes through `.githooks/pre-push` running `check.sh`.
# The hook was cut down to branch rules alone when a ten-minute hook was found to
# break pushing outright -- it now prints "branch rules only; tests, clippy and
# conformance run in CI on the pull request" -- so from that day nothing checked a
# push at all, and the comment went on asserting that something did.
#
# WHAT THAT LEFT UNCHECKED, and it is not hypothetical. `main` had never once been
# built by CI. Not on a merge, not on a release, not on a tag. On 2026-09-26 the
# entire history of this repository was rewritten and force-pushed to `main` and
# `develop`, and zero workflow runs fired. A force-push is exactly the case where
# you want a build, because it is the one operation that can change what is on a
# branch without a pull request ever existing.
#
# So: pushes to main and develop, and release tags, are built. Feature branches are
# not listed, so a push to one still runs nothing until its pull request opens, and
# there is no double run.
#
# The performance check is still NOT here. A wall-clock measurement on a shared
# runner measures the runner, not the code. It stays on the build host, which is
# quiet, where the candidate is compared against a base build in an interleaved
# A/B. See CLAUDE.md, "Why the build host and not the laptop" -- the same
# argument applies twice over to a runner shared with the rest of the world.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    tags: ['v*']
  # Manual, for re-running against a branch without opening a pull request.
  workflow_dispatch:

# One run per ref. A second push supersedes the first rather than queueing behind
# it, which matters on a 12-minute job. Never cancels a tag build: a release is
# built once and the result is the record of it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # `main` takes a pull request from `develop` and from nothing else, which
  # CLAUDE.md has said since 2026-09-14 and nothing checked until #196.
  #
  # Neither of the other two mechanisms can close this. `.githooks/pre-push` runs
  # on a developer's machine at push time, and `main` does not move by a push: it
  # moves by a merge on GitHub. A branch ruleset can require a pull request and can
  # require checks to pass, and it has no rule for the source branch. So a check
  # that reads the pull request's head is the only place the constraint fits.
  #
  # The job below the release gate tests `base_ref == 'main'`, which asks where a
  # pull request is going. Nothing asked where it came from, so a work branch aimed
  # straight at `main` passed every check and was offered for merge. A green run on
  # a broken branch model is the same shape of defect as a conformance script that
  # skips a protocol and reports success.
  #
  # No checkout, deliberately: this must fail in seconds, not after the build.
  branch-source:
    name: main takes develop only
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # The branch name comes from whoever opened the pull request, so it reaches
      # the script as data in an environment variable, never pasted into it.
      - name: The head branch must be develop
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::main takes pull requests from develop only."
            echo "This pull request is from '$HEAD_REF'."
            echo ""
            echo "main is the release line. Merge into develop first, then"
            echo "open develop -> main as the release:"
            echo "  gh pr create --base develop --head $HEAD_REF"
            echo "  # merge that, bump the version and write the CHANGELOG entry, then:"
            echo "  gh pr create --base main --head develop --title 'Release X.Y.Z'"
            exit 1
          fi
          echo "head is develop, allowed"

  # Clippy is a job of its own so its name in a notification means a clippy
  # finding and nothing else. It needs no release build, so it runs beside the
  # build-and-test job and reports within minutes.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Clippy must be silent: `-D warnings`, no ceiling. It went to zero on
      # 2026-09-13 and is held there the same way rustc warnings are. A new
      # lint from a toolchain upgrade fails this, which is intended.
      - name: Clippy, silent
        run: ./tools/clippy.sh

  # Every independent check runs even when an earlier one failed
  # (`!cancelled()`), so one push reports every failure at once: a dying test
  # used to skip clippy, and its problems surfaced only on the next push. A
  # check that needs an earlier step's output (the toolchain, compiled tests)
  # runs only if that output exists, so it is skipped rather than failing again
  # for the same reason. A warning fails its own step and never skips a check
  # that needs only the code to compile. Clippy is the job above.
  build-and-test:
    name: build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      # Enforceable as of 2026-09-13, when the tree was formatted. Before that
      # it would have rewritten 1,890 places: the code aligned struct fields by
      # hand and rustfmt undoes that. The owner's call was to run it and accept
      # the result, so now there is one answer to what the formatting is and no
      # one has to hold it in their head.
      - name: Formatting
        run: cargo fmt --all --check

      # Zero warnings, release and test builds, pre-existing included. This is
      # a standing rule and it is checked on Linux because that is where it
      # runs: three defects have only ever shown up there.
      - name: Release build, zero warnings
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          status=0
          cargo build --workspace --release > build.log 2>&1 || status=$?
          cat build.log
          [ "$status" -eq 0 ] || { echo "::error::the release build failed with status $status"; exit 1; }
          n=$(grep -c '^warning' build.log || true)
          echo "release warnings: $n"
          [ "$n" -eq 0 ] || { echo "::error::$n release warning(s)"; exit 1; }

      - name: Test build, zero warnings
        id: testbuild
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          status=0
          # Cargo's build-dir layout leaves a binary built only for tests out of
          # <target>/<profile>, and testkit::binary() reads it from there, so
          # the workspace binaries are built first, as the harness documents.
          { cargo build --workspace --bins && cargo test --workspace --no-run; } > testbuild.log 2>&1 || status=$?
          cat testbuild.log
          # The suite needs the tests to compile, not to compile without
          # warnings, so it runs on this output and a warning cannot hide it.
          [ "$status" -eq 0 ] && echo "compiled=true" >> "$GITHUB_OUTPUT"
          [ "$status" -eq 0 ] || { echo "::error::the test build failed with status $status"; exit 1; }
          n=$(grep -c '^warning' testbuild.log || true)
          echo "test-build warnings: $n"
          [ "$n" -eq 0 ] || { echo "::error::$n test-build warning(s)"; exit 1; }

      # A workspace build unifies features, so neither build above compiles
      # m6-core with its default `templates` and `minify` off. A call to a gated
      # module from outside its gate then compiles green here and fails for a
      # user who depends on core with `default-features = false`. The lean
      # build is the only one that asks that question, so it is a separate
      # command and not part of the workspace run.
      - name: Lean core build, zero warnings
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          status=0
          cargo check -p m6-core --no-default-features > lean-core.log 2>&1 || status=$?
          cat lean-core.log
          [ "$status" -eq 0 ] || { echo "::error::the no-default-features build failed with status $status"; exit 1; }
          n=$(grep -c '^warning' lean-core.log || true)
          echo "lean-core warnings: $n"
          [ "$n" -eq 0 ] || { echo "::error::$n lean-core warning(s)"; exit 1; }

      # Capture in full, then report. Grepping the pipe drops the assertion
      # message and leaves a bare `panicked at <file>:<line>`, which names the
      # place and not the reason.
      - name: Test suite
        if: ${{ !cancelled() && steps.testbuild.outputs.compiled == 'true' }}
        run: |
          # m6-http pins its memory at start (`[server] lock_memory`, on by default),
          # and a runner account's RLIMIT_MEMLOCK is 8 MiB. This shell is raised, and the
          # processes it starts inherit the limit, so the m6-http the tests start can pin.
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          status=0
          cargo test --workspace > full.log 2>&1 || status=$?
          grep -E '^test result:' full.log || true
          if grep -q '^failures:' full.log; then
            sed -n '/^failures:/,$p' full.log | head -80
            echo "::error::tests failed"
            exit 1
          fi
          # A test build that does not compile, or a test binary that aborts,
          # prints no `failures:` line, so cargo's own status decides as well.
          [ "$status" -eq 0 ] || { tail -80 full.log; echo "::error::cargo test exited with status $status"; exit 1; }

      # `cargo test --workspace` builds only the targets whose `required-features`
      # the workspace turns on. Any other target is omitted, not run, so the test
      # is invisible and rots. Those targets are named in one script, and the
      # three jobs below, check.sh and tools/build-host-tests.sh all call it, so
      # CI and every local gate run the same list. It was two lists until
      # h1_tls_miss_insert failed here while the local gate reported green.
      - name: Feature-gated tests, named explicitly
        if: ${{ !cancelled() && steps.testbuild.outputs.compiled == 'true' }}
        run: |
          # m6-http pins its memory at start (`[server] lock_memory`, on by default),
          # and a runner account's RLIMIT_MEMLOCK is 8 MiB. This shell is raised, and the
          # processes it starts inherit the limit, so the m6-http the tests start can pin.
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          ./tools/feature-gated-tests.sh

      # Nothing in the workspace turns on some off-by-default core features
      # (`sqlite`, `email`, `multipart`), so `cargo test --workspace` never
      # compiles or runs their code. That is the `templates` scar (two csrf
      # tests stayed broken), so m6-core is built, warned on and tested here
      # with every feature on, and a new feature is covered without an edit.
      - name: Opt-in core features, zero warnings and tests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          cargo test -p m6-core --lib --all-features --no-run 2>&1 | tee featbuild.log
          n=$(grep -c '^warning' featbuild.log || true)
          [ "$n" -eq 0 ] || { echo "::error::$n warning(s) building m6-core --all-features"; exit 1; }
          # The integration tests need built binaries, so only the library tests
          # and the doctests run here.
          # The status is kept, so a test that aborts or crashes fails the step
          # even though it prints no `failures:` line.
          status=0
          { cargo test -p m6-core --lib --all-features && cargo test -p m6-core --doc --all-features; } > feat.log 2>&1 || status=$?
          grep -E '^test result:' feat.log || true
          if grep -q '^failures:' feat.log; then sed -n '/^failures:/,$p' feat.log | head -80; echo "::error::m6-core --all-features tests failed"; exit 1; fi
          [ "$status" -eq 0 ] || { tail -80 feat.log; echo "::error::m6-core --all-features tests exited with status $status"; exit 1; }

      # The other side of those features: core with none of them must build
      # without a warning, and the services that use neither templates nor
      # minifiers must not link them. `cargo tree` is asked per package because
      # the workspace build unifies features, and m6-html and m6-md take the defaults.
      - name: Core with no features, and services that link no engine
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo check -p m6-core --no-default-features > nofeat.log 2>&1 || { cat nofeat.log; echo "::error::m6-core does not build with no features"; exit 1; }
          n=$(grep -c '^warning' nofeat.log || true)
          [ "$n" -eq 0 ] || { cat nofeat.log; echo "::error::$n warning(s) building m6-core with no features"; exit 1; }
          for p in m6-http m6-monitor m6-auth-server m6-auth-cli m6-redirect; do
            tree=$(cargo tree -e normal -p "$p") || { echo "::error::cargo tree failed for $p"; exit 1; }
            if grep -E ' (lightningcss|minify-html|oxc|boa_engine|tera|comrak) v' <<< "$tree"; then
              echo "::error::$p links a template engine or a minifier"; exit 1
            fi
          done

      # Broken intra-doc links are rustdoc warnings, and the zero-warnings rule
      # counts pre-existing warnings, so this step holds them at zero. Nothing
      # ran it until 2026-11-17: a worker ran `cargo doc` by hand on an
      # unrelated task and found twelve broken links across ten files, because
      # neither the gate nor this file named the command.
      #
      # A step in this job and not a job of its own: `cargo doc` reads the same
      # source and reuses the same rust-cache as the steps beside it, so the
      # price of a separate runner is a cold rebuild of every dependency for one
      # command.
      #
      # `--all-features` because `testkit`, m6-core's `sqlite`, `email` and
      # `multipart` and m6-http's allocation counters are off by default, so the
      # first line does not compile their docs. Three of the twelve links were
      # behind those features, which is the same gap the "Opt-in core features"
      # step above exists for.
      - name: Rustdoc, silent
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

  # The same build and tests on the other two supported targets. Supported
  # means built and tested here: macOS arm64 and Linux arm64, on GitHub's
  # free runners for a public repository. The steps are the ones above, in
  # the same form, so a warning or a failure is reported the same way. Each
  # job first prints the machine it ran on, so a run's record says which
  # target it proved. Conformance, the dependency check, the shell check, the
  # perf tools and the examples stay on Linux x86_64: h2spec and h3spec are
  # released as x86_64 Linux binaries, cargo-deny checks all three targets'
  # graphs in one run, and the rest is platform-independent.
  build-and-test-macos:
    name: macOS arm64 build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - id: toolchain
        uses: dtolnay/rust-toolchain@stable
