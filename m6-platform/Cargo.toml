[package]
name    = "m6-platform"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

# The only crate in the workspace that knows which operating system it runs
# on, and the only one that names `mio`, `nix`, `rustix` or `libc`: the gate
# test `tests/platform_gate.rs` holds that. m6-core re-exports it as
# `m6_core::platform`, so a service links m6-core alone and names nothing here
# by its crate name.

[lib]
name = "m6_platform"

[dependencies]
# The reactor behind `Poll`: epoll on Linux, kqueue on macOS.
mio     = { version = "1", features = ["os-poll", "os-ext", "net"] }
# Safe system calls: signal masks, signalfd and kqueue, poll, statvfs,
# rlimits, if_nametoindex, waitpid, dup and fcntl.
# Safe system calls: signal masks, signalfd and kqueue, poll, statvfs,
# rlimits, if_nametoindex, waitpid, dup and fcntl. `feature` is what makes
# `sys::utsname` (`uname`) available to the host facts.
nix     = { version = "0.31", features = ["feature", "hostname", "signal", "poll", "event", "fs", "resource", "net", "process", "user", "mman"] }
# Socket construction with the options every m6 socket needs. `all` for
# `SO_NOSIGPIPE` on macOS.
socket2 = { version = "0.6", features = ["all"] }
# `posix_spawn` with `POSIX_SPAWN_CLOEXEC_DEFAULT` on macOS, `close_range` and
# `waitpid` with the raw status, none of which `nix` wraps.
libc    = "0.2"
# The host readings are published as JSON by a monitoring service.
serde   = { version = "1", features = ["derive"] }

# Per OS family, so the Linux build links no `sysinfo` and the macOS build no
# `rustix` process code. These two tables are the one place outside `src/`
# that names a `target_os`, and the gate test allows them.
[target.'cfg(target_os = "linux")'.dependencies]
# `pidfd_open`, which `nix` does not wrap.
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Host readings (memory, load, uptime, interface counters) where there is no
# /proc: Linux reads /proc and /sys directly, today's code, and links none of
# this. Default features off: `multithread` would start a rayon pool.
sysinfo = { version = "0.31", default-features = false, features = ["system", "network"] }
# A process's threads and open descriptors (`proc_pidinfo`), safely.
libproc = "0.14"
# `kern.maxfilesperproc`, safely.
sysctl  = "0.6"

[dev-dependencies]
serde_json = "1"
tempfile   = "3"
# `BuildIdentity`'s formats are held by a test that parses them with the semver
# crate, not by a hand-rolled pattern. Already in the lockfile through the
# workspace's build tooling, so the build gains no package.
semver     = "1"
# The custom-harness tests speak libtest's protocol (`--list --format terse`,
# `--exact <name>`), which is what `nextest` lists and runs.
libtest-mimic = "0.8"

# The signal contract. Its own `main` so the signals are blocked before any
# thread exists.
[[test]]
name    = "platform_signals"
harness = false
