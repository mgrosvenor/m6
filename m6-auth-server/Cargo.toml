[package]
name    = "m6-auth-server"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "m6-auth-server"

[dependencies]
m6-auth      = { path = "../m6-auth" }
m6-core      = { path = "../m6-core", default-features = false }
jsonwebtoken = "9"
toml         = "0.8"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
anyhow       = "1"
sha2         = { version = "0.10", features = [] }
hex          = "0.4"

[build-dependencies]
m6-platform = { path = "../m6-platform" }

[dev-dependencies]
m6-core         = { path = "../m6-core", default-features = false, features = ["testkit"] }
tempfile        = "3"
jsonwebtoken    = "9"
serde_json      = "1"
m6-auth         = { path = "../m6-auth", features = ["testkit"] }
rusqlite        = { version = "0.41", features = ["bundled"] }
