# m6-file is an `App` service: the handler is registered in code under the name
# `files`, and every route it answers is declared here.
#
# `{*relpath}` is the wildcard form, deliberately explicit. m6-file's own
# matcher used to make a bare trailing `{relpath}` greedy; core does not,
# because making the last `{param}` implicitly span several segments would
# silently change the meaning of every route already written.

# Sized like production (`size = 32`), and the test suite needs it to be.
#
# The old m6-file fed a fixed worker set through an **unbounded** `mpsc`
# channel, so a burst queued without limit. `App` uses a bounded pool and
# answers **503 when the queue is full**, which is the better design -- an
# unbounded queue under overload converts a throughput problem into an
# unbounded latency one -- but it is a behaviour change, and it has to be
# sized for the real burst. `queue_size` defaults to `size * 8`, so this is a
# 32-worker pool with a 256-deep queue; `l5_concurrent_requests` fires 100 at
# once and the default (`num_cpus`) is not enough for it.
[thread_pool]
size = 32

[compression]
"text/css"               = { brotli = 6, gzip = 6 }
"application/javascript" = { brotli = 6, gzip = 6 }
"image/jpeg"             = { brotli = 0, gzip = 0 }

[[route]]
path    = "/assets/{*relpath}"
handler = "files"
root    = "assets/"

[[route]]
path    = "/content/posts/{stem}/{filename}"
handler = "files"
root    = "content/posts/{stem}/"
