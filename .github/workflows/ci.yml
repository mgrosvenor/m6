          echo "test-build warnings: $n"
          [ "$n" -eq 0 ] || { echo "::error::$n test-build warning(s)"; exit 1; }
      - name: Test suite
        if: ${{ !cancelled() && steps.testbuild.outputs.compiled == 'true' }}
        run: |
          status=0
          cargo test --workspace > full.log 2>&1 || status=$?
