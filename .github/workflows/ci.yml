          n=$(grep -c '^warning' nofeat.log || true)
          [ "$n" -eq 0 ] || { cat nofeat.log; echo "::error::$n warning(s) building m6-core with no features"; exit 1; }
      - name: Clippy, silent
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: ./tools/clippy.sh

      # Broken intra-doc links are rustdoc warnings, and the zero-warnings rule
      # counts pre-existing warnings, so this step holds them at zero. Nothing
      # ran it until 2026-11-17: a worker ran `cargo doc` by hand on an
      # unrelated task and found twelve broken links across ten files, because
      # neither the gate nor this file named the command.
      #
      # A step in this job and not a job of its own: `cargo doc` reads the same
      # source and reuses the same rust-cache as the steps beside it, so the
      # price of a separate runner is a cold rebuild of every dependency for one
      # command.
      #
      # `--all-features` because `testkit`, m6-core's `sqlite`, `email` and
      # `multipart` and m6-http's allocation counters are off by default, so the
      # first line does not compile their docs. Three of the twelve links were
      # behind those features, which is the same gap the "Opt-in core features"
      # step above exists for.
      - name: Rustdoc, silent
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

  conformance:
    name: h1, h2, h3 conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # h1spec is delivered through uvx. On the build host this was installed
      # but not on the gate's PATH, and the resulting skip was silent, so the
      # four h1 targets went ungated for weeks on the one box that gated a
      # deploy. Install it explicitly and let the script fail if it is absent.
      - uses: astral-sh/setup-uv@v5

      - name: Install h2spec
        run: |
          curl -sSL -o h2spec.tar.gz \
            https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
          tar xzf h2spec.tar.gz
          sudo install -m755 h2spec /usr/local/bin/h2spec
          h2spec --version

      - name: Install h3spec
        run: |
          curl -sSL -o h3spec \
            https://github.com/kazu-yamamoto/h3spec/releases/download/v0.1.13/h3spec-linux-x86_64
          sudo install -m755 h3spec /usr/local/bin/h3spec

      - name: Build the servers under test
        run: cargo build --workspace --bins

      # WITHOUT --allow-missing-tools, deliberately. All three testers are
      # installed above, so an absent one here is a failure and not a skip.
      # That flag exists for a laptop and is never a way to ship.
      - name: Conformance
        run: |
          # m6-http pins its memory at start (`[server] lock_memory`, on by default),
          # and a runner account's RLIMIT_MEMLOCK is 8 MiB. This shell is raised, and the
          # processes it starts inherit the limit, so the m6-http the tests start can pin.
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          ./tools/conformance.sh

      # Debug assertions off, as in a release build. Everything above runs the
      # dev profile, where a `debug_assert!` argument runs. A write inside one
      # vanishes from a release binary, and HTTP/2's frame writer once did that:
      # the shipped m6-http sent no HTTP/2 frame while every dev-profile check
      # passed. The `release-asserts` profile is the dev profile with debug
      # assertions off, so this costs a dev-speed build, not a fat-LTO one.
      - name: HTTP/2 without debug assertions
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          cargo build --workspace --bins --profile release-asserts
          cargo test -p m6-http --lib --profile release-asserts http2
          M6_BIN_DIR="$PWD/target/release-asserts" ./tools/conformance.sh h2

  dependencies:
    name: advisories, licences, duplicates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # m6 carried `# shellcheck disable=` directives for months and nothing ever ran
      # shellcheck, so the directives were decoration and the findings accumulated
      # unseen. When first run on 2026-09-16 there were 2 errors and 14 warnings, and
      # both errors were real: `for p in ${PIDS[@]:-}` in tools/conformance.sh, an
      # unquoted array expansion in the path that kills the harness's own child
      # processes, so an element containing whitespace would re-split and kill the
      # wrong thing or nothing at all.
      #
      # Warning level, not style: style is 100+ findings of preference across this
      # repo, and a gate that reports preference gets ignored, which is how the two
      # real errors survived.
      #
      # THE GIT HOOKS ARE SHELL AND ARE NOT NAMED `*.sh`. This found `*.sh` alone
      # until 2026-09-26, so `.githooks/pre-push` -- the script that decides what may
      # be pushed where, and the one shell file in this repository that runs on every
      # developer's machine -- was the one never checked. It had an unused-variable
      # warning sitting in it the whole time. A gate selecting its inputs by file
      # extension misses exactly the files that do not get one, and hooks never do.
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          FAIL=0
          COUNT=0
          while IFS= read -r f; do
            COUNT=$((COUNT + 1))
            if ! shellcheck -S warning "$f"; then FAIL=1; fi
          done < <(find . \( -name '*.sh' -o -path './.githooks/*' \) -type f -not -path './target/*' -not -path './.git/*')
          echo "checked $COUNT shell script(s)"
          exit $FAIL

      # A teardown that selects its victim by name, port or command-line text
      # kills another session's stack as easily as its own. bf5e737 and 0f1f2ee
      # removed the last of those from the examples; this keeps a new one from
      # landing. It reads the tracked tree only and runs in well under a second.
      - name: a teardown kills only a recorded pid
        run: ./tools/check-kill-safety.sh

  # A history rewrite changes every commit hash in the repository at once, and
  # the ones written into the documents are no exception. The 2026-09-26
  # rewrite killed thirteen hashes in docs/PERFORMANCE.md, 83e4142 repointed
  # them, and the rewrite after that killed the replacements too. Nothing ran
  # that noticed either time (a sweep found the repository had no docs check),
  # so the next rewrite would be silent as well.
  #
  # FULL HISTORY, deliberately: `git cat-file` can only say a hash is dead if
  # the clone has the objects that should contain it. The checkout defaults to
  # depth 1 on a runner, and the script refuses a shallow clone rather than
  # call every hash dead. The job is seconds long and installs nothing, so it
  # is its own job rather than a step in a build job that would then have to
  # fetch the whole history twice.
  commit-hashes:
    name: documents name live commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./tools/check-commit-hashes.sh

  # The perf gate's statistic is tested Rust (m6-http's perf_ab module) and its
  # tests run in the existing build-and-test job. This job checks only that the
  # C client it relies on builds with no warnings, that the leftover-server
  # check matches both arms, and measures nothing.
  perf-tools:
    name: perf tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the C client builds with no warnings
        run: cc -O2 -std=c11 -Wall -Wextra -Werror -o /tmp/perf_client tools/perf_client.c
      - name: the leftover-server check matches both arms
        run: ./tools/perfcheck-stray-test.sh

  examples:
    name: the examples build and work
    runs-on: ubuntu-latest
    # It finishes in about ten minutes with a warm cache and needs about twenty
    # five when a version change leaves the cache cold (1.17.0 ran out at 20).
    # Without a limit a hung stack kept this job for the default six hours.
    timeout-minutes: 40
    steps:
      # The examples are examples/ in this repository, their own Cargo
      # workspace. The renderer crates depend on m6-core by relative path, so
      # they build against the m6 in this same checkout.
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            examples

      - name: Build m6
        id: build_m6
        run: |
          cargo build --workspace --release
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      # Zero warnings and silent clippy, the same standard as m6 itself: a reader
      # copies from these.
      - name: Examples build, zero warnings
        id: build_examples
        working-directory: examples
        run: |
          status=0
          cargo build --release > build.log 2>&1 || status=$?
          cat build.log
          # The end-to-end step needs the binaries, not a warning-free build.
          [ "$status" -eq 0 ] && echo "compiled=true" >> "$GITHUB_OUTPUT"
          [ "$status" -eq 0 ] || { echo "::error::the examples build failed with status $status"; exit 1; }
          n=$(grep -c '^warning' build.log || true)
          echo "examples release warnings: $n"
          [ "$n" -eq 0 ] || { echo "::error::$n warning(s) building the examples"; exit 1; }

      - name: Examples rustfmt
        if: ${{ !cancelled() }}
        working-directory: examples
        run: cargo fmt --all --check

      - name: Examples clippy, silent
        if: ${{ !cancelled() && steps.build_m6.outcome == 'success' }}
        working-directory: examples
        run: |
          status=0
          cargo clippy --workspace --all-targets --release > clippy.log 2>&1 || status=$?
          cat clippy.log
          # An error-level lint prints `error:` and no warning, so clippy's own
          # status decides as well as the warning count.
          [ "$status" -eq 0 ] || { echo "::error::clippy failed on the examples with status $status"; exit 1; }
          n=$(grep -c '^warning' clippy.log || true)
          [ "$n" -eq 0 ] || { echo "::error::$n clippy finding(s) in the examples"; exit 1; }

      # The examples are the platform layer's users too: no example names an
      # OS in a cfg or links mio, nix, rustix or libc. The same rule the gate
      # test holds for m6, as a grep here because the examples are a separate workspace.
      - name: Examples name no platform
        if: ${{ !cancelled() }}
        working-directory: examples
        run: |
          if grep -rnE --include='*.rs' --exclude-dir=target 'target_os|cfg\(unix|cfg\(windows|\b(mio|nix|rustix|libc)::|^\s*use (mio|nix|rustix|libc)\b' .; then
            echo "::error::an example names the operating system or an OS crate: that belongs in m6-platform"; exit 1
          fi
          if grep -nE '^\s*(mio|nix|rustix|libc)\s*=' */*/Cargo.toml */Cargo.toml 2>/dev/null; then
            echo "::error::an example declares an OS crate"; exit 1
          fi
          echo "no example names the operating system"

      - name: Examples unit tests
        if: ${{ !cancelled() && steps.build_m6.outcome == 'success' }}
        working-directory: examples
        run: |
          # Example 05's end-to-end test makes its own certificate, keys and
          # auth database in a temporary directory, so it runs here with the
          # rest (it needed dev.sh's state before the platform layer).
          # Examples 05 and 09 start m6-http, which pins its memory at start, and
          # a runner account's RLIMIT_MEMLOCK is 8 MiB, as in the test jobs above.
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          status=0
          cargo test --workspace > full.log 2>&1 || status=$?
          grep -E '^test result:' full.log || true
          if grep -q '^failures:' full.log; then
            sed -n '/^failures:/,$p' full.log | head -60
            echo "::error::example tests failed"
            exit 1
          fi
          [ "$status" -eq 0 ] || { tail -60 full.log; echo "::error::cargo test exited with status $status"; exit 1; }

      # A guide that shows m6-http must show a command that starts: m6-http takes a
      # site directory and a system config. A renewal hook that touches a system
      # config only works when that file is the one m6-http is started with, so
      # every `touch` path must be one the same file passes to m6-http. Reads
      # the guides and the unit files.
      - name: Guides start m6-http with two arguments, and hooks touch its config
        working-directory: examples
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          files = subprocess.check_output(
              ["git", "ls-files", "*.md", "*.service", ":!*posts.json"], text=True).split()
          bad = []
          for f in files:
              text = open(f, encoding="utf-8").read().replace("\\\n", " ")
              configs = set()
              for m in re.finditer(r"^ExecStart=\S*/m6-http\s+(.*)$", text, re.M):
                  args = m.group(1).split()
                  if len(args) < 2:
                      bad.append(f"{f}: m6-http ExecStart passes {len(args)} argument(s), needs 2: {m.group(0)}")
                  else:
                      configs.add(args[1])
              for m in re.finditer(r"NODE_CONFIG=(\S+)", text):
                  configs.add(m.group(1))
                  configs.add("${NODE_CONFIG}")
              for m in re.finditer(r"^touch (/etc/m6/\S+\.toml)\s*$", text, re.M):
                  if m.group(1) not in configs:
                      bad.append(f"{f}: a hook touches {m.group(1)}, which m6-http is not started with here")
          print("\n".join(bad) if bad else f"{len(files)} files checked")
          sys.exit(1 if bad else 0)
          PY

      # m6-file's config schema changed on 2026-09-12 and ten example configs
      # were left naming no handler, so the service exited 2 before binding and
      # every asset in every example returned 502 for two days. Parsing each
      # config with the real binary is a second of work and catches that outright.
      #
      # Every example is accounted for. 06-systemd is systemd units with no site
      # config, and 09-global-deployment holds one system config per node and one
      # site config per role, so it has no single configs/system-dev.toml for this
      # loop to parse; its own integration test covers it and ran above. An
      # example with neither a config nor a reason recorded here fails the job.
      # A FRESH CHECKOUT HAS NO CERTIFICATES, and the config parse needs them:
      # m6-http validates that tls_cert exists. The development keys live in
      # /tmp/m6/dev, written by ./dev-keys.sh, which the config parse
      # below needs, so this step runs it ahead of the parse.
      - name: Generate development certificates
        id: certs
        if: ${{ !cancelled() }}
        working-directory: examples
        run: |
          ./dev-keys.sh

      - name: Every example's config parses
        if: ${{ !cancelled() && steps.build_m6.outcome == 'success' }}
        working-directory: examples
        run: |
          bad=0 unexplained=0
          for d in */; do
            name=$(basename "$d")
            case "$name" in
              data|common|target) continue ;;
              06-systemd) echo "  $name  not parsed: systemd units only, no site config"; continue ;;
              09-global-deployment) echo "  $name  not parsed: per-node configs, no single system-dev.toml; its integration test covers it"; continue ;;
            esac
            sys="$d/configs/system-dev.toml"
            [ -f "$sys" ] || sys="$d/site.toml"
            if [ ! -f "$sys" ]; then
              echo "  $name  NO CONFIG and no reason recorded for that"
              unexplained=$((unexplained + 1)); continue
            fi
            # The checked-in config names the key directory as @M6_DEV_HOME@;
            # m6 reads the copy with the real path filled in.
            sys=$(. ./dev-home.sh && m6_conf "$sys")
            if out=$(m6-http "$(cd "$d" && pwd)" "$sys" --dump-config 2>&1 >/dev/null) && [ -z "$out" ]; then
              echo "  $name  ok"
            else
              echo "  $name  $(echo "$out" | head -1)"
              bad=$((bad + 1))
            fi
          done
          [ "$bad" -eq 0 ] || { echo "::error::$bad example config(s) rejected by m6-http"; exit 1; }
          [ "$unexplained" -eq 0 ] || { echo "::error::$unexplained example(s) with no config and no recorded reason"; exit 1; }

      # The one example that runs the whole stack: m6-http at the edge, m6-html,
      # m6-file, m6-md, m6-auth-server and a custom renderer. If this passes, the
      # parts work together.
      #
      # A FRESH CHECKOUT, which is the point: keys/ and the auth database are not
      # in git, so dev.sh generates a certificate with openssl (the runner has no
      # mkcert) and creates the admin user. That is exactly what a new reader gets
      # on step one of the README, and it is checked here rather than assumed.
      - name: Example 05, end to end over the running stack
        if: ${{ !cancelled() && steps.build_examples.outputs.compiled == 'true' && steps.certs.outcome == 'success' }}
        working-directory: examples/05-cms
        run: |
          # m6-http pins its memory at start (`[server] lock_memory`, on by default),
          # and a runner account's RLIMIT_MEMLOCK is 8 MiB. This shell is raised, and the
          # processes it starts inherit the limit, so the m6-http the tests start can pin.
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          M6="$GITHUB_WORKSPACE" M6_NO_BROWSER=1 ./dev.sh --no-open > dev.log 2>&1 &
          dev_pid=$!
          dev_start=$(ps -o lstart= -p "$dev_pid" 2>/dev/null | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || true)
          printf '%s\t%s\n' "$dev_pid" "${dev_start:--}" > .ci-dev.pid
          # dev.sh builds m6 and render-cms in release before it starts the
          # stack, which can take minutes on a cold runner. Wait for the stack
          # to answer, for dev.sh to exit (a failed start), or for 15 minutes.
          for _ in $(seq 1 900); do
            code=$(curl -sk --http1.1 -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/ 2>/dev/null || true)
            [ "$code" = "200" ] && break
            kill -0 "$dev_pid" 2>/dev/null || break
            sleep 1
          done
          if [ "$(curl -sk --http1.1 -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/ 2>/dev/null)" != "200" ]; then
            echo "--- dev.sh ---"; tail -40 dev.log
            echo "--- services ---"; tail -20 logs/*.log 2>/dev/null || true
            echo "::error::the 05-cms stack never answered"
            exit 1
          fi
          # `|| { dump; exit 1; }` — when the suite fails, the service logs are the
          # only way to tell a broken example from a broken backend. Without this,
          # 33 failures showing 502s said nothing about WHICH service was down.
          ./test.sh || { echo "--- service logs ---"; tail -30 logs/*.log 2>/dev/null; exit 1; }
          (cd "$GITHUB_WORKSPACE/examples" && cargo test -p render-cms --test integration)

      - name: Stop the stack
        if: always()
        working-directory: examples/05-cms
        run: |
          # Stop the dev.sh this job started, and only that pid. The run step
          # wrote the pid and its start time here when it started dev.sh. A pid
          # that now belongs to another process has a different start time, so
          # it is left alone. dev.sh's EXIT trap stops the services it started.
          # This used to be `pgrep -f "$PWD"`, a command-line match that reaches
          # anything mentioning the directory and proves nothing about who
          # started it.
          [ -f .ci-dev.pid ] || exit 0
          IFS=$'\t' read -r pid start < .ci-dev.pid || true
          case "$pid" in ''|*[!0-9]*) exit 0 ;; esac
          kill -0 "$pid" 2>/dev/null || exit 0
          now=$(ps -o lstart= -p "$pid" 2>/dev/null | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || true)
          if [ "${start:--}" != "-" ] && [ -n "$now" ] && [ "$now" != "$start" ]; then
            echo "pid $pid is a different process now; leaving it alone"
            exit 0
          fi
          kill "$pid" 2>/dev/null || true
          i=0
          while kill -0 "$pid" 2>/dev/null && [ "$i" -lt 50 ]; do
            sleep 0.1
            i=$((i + 1))
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill -9 "$pid" 2>/dev/null || true
          fi

      # Examples 03 and 04 each have a test.sh: 03 drives the contact form against
      # a scripted mail relay it starts itself, and 04 drives the auth server
      # (login, refresh, logout, the throttle). They share port 8443 with 05, so
      # this runs after 05's stack is stopped, and each stack here is stopped, by
      # the pid this step recorded, before the next one starts.
      - name: Examples 03 and 04, end to end
        if: ${{ !cancelled() && steps.build_examples.outputs.compiled == 'true' && steps.certs.outcome == 'success' }}
        working-directory: examples
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          status=0
          for ex in 03-contact 04-auth; do
            echo "=== $ex ==="
            M6="$GITHUB_WORKSPACE" "$ex/dev.sh" > "$ex/dev.log" 2>&1 &
            dev_pid=$!
            code=000
            # As for 05: dev.sh may build before it starts, so wait for the stack,
            # for dev.sh to exit, or for 15 minutes.
            for _ in $(seq 1 900); do
              code=$(curl -sk --http1.1 -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/ 2>/dev/null || true)
              [ "$code" = "200" ] && break
              kill -0 "$dev_pid" 2>/dev/null || break
              sleep 1
            done
            if [ "$code" = "200" ]; then
              "$ex/test.sh" || { echo "--- $ex service logs ---"; tail -30 "$ex"/logs/*.log 2>/dev/null; status=1; }
            else
              echo "--- $ex dev.sh ---"; tail -40 "$ex/dev.log"
              echo "::error::the $ex stack never answered"
              status=1
            fi
            kill "$dev_pid" 2>/dev/null || true
            wait "$dev_pid" 2>/dev/null || true
          done
          [ "$status" -eq 0 ] || { echo "::error::an example test.sh failed"; exit 1; }

  changelog:
    name: the release says what changed and m6's docs say what is true
    # Only for a release: a pull request into main IS the release now, so this is
    # where `release.sh`'s changelog guard lives. It refused to cut a release
    # without an entry for the version; that script is gone, and the guard is not.
    #
    # THE HANDOVER CHECK BECAME A DOCS CHECK, 2026-09-26. Owner's rule from
    # 2026-09-25 stands unchanged: DOCS BEING UP TO DATE IS A FUNDAMENTAL PART OF
    # A RELEASE, not a follow-up to one. What changed is which documents it can
    # ask about. HANDOVER.md states which of one particular deployment's boxes
    # runs what, so it is not a public document and now lives in the private
    # deployment repository, where a workflow here cannot read it.
    #
    # THE RIGHT RESPONSE WAS TO WIDEN THIS, NOT DROP IT, and the first attempt
    # dropped it. m6 has its own docs and they go stale in exactly the same way:
    # on 2026-09-26 a sweep found docs/H2-PLAN.md leading with h3spec 37/49
    # thirteen days after it became 47/49, CONTRIBUTING.md describing a clippy
    # ceiling removed on 2026-09-13, and README.md saying a decision "gates a 1.0
    # release" twelve days after 1.0 was cut. The handover check would not have
    # caught one of them.
    #
    # What a workflow can honestly decide here is narrow: a changelog entry
    # exists, and the version is untagged. Freshness is judgement, and the release
    # checklist in .github/pull_request_template.md is where it is asked for, at
    # the moment the author knows the answer. That is the same mechanism the
    # handover check actually relied on: it never verified the handover was TRUE,
    # only that someone had opened it while they knew.
    #
    # A mechanical "no doc names a script that does not exist" check was written
    # for this job on 2026-09-26 and thrown away after being measured: 87
    # findings, of which about 80 were legitimate, because m6's docs reference the
    # deployment repository's scripts, the examples repository's, and scripts a
    # USER writes in their own project. A gate at that signal-to-noise gets muted,
    # which is how the two real errors in this repository's shell survived for
    # months. The narrow version of that check is a test, not a gate:
    # `every_script_offered_as_a_remedy_exists` in m6-core/tests/pre_push_hook.rs
    # covers the pre-push hook and this template, which is where it earns its
    # keep.
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CHANGELOG.md has an entry for this version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "workspace version: $v"
          if ! grep -qE "^## +\[?${v}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${v}' section."
            echo "A release says what changed in it: what changed, why it mattered,"
            echo "and how it was verified. Write the entry before merging to main."
            exit 1
          fi
          echo "found the entry:"
          sed -n "/^## \+\[\?${v}/,/^## /p" CHANGELOG.md | head -20

      - name: the version is not already tagged
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if git rev-parse "v$v" >/dev/null 2>&1; then
            echo "::error::v$v already exists as a tag. Bump the version in Cargo.toml."
            exit 1
          fi
          echo "v$v is free"

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from the workspace
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # Declaring an MSRV and not testing it is a claim, not a fact.
      - run: cargo check --workspace --all-targets
