# The event-loop rule (docs/m6-architecture.md): no blocking call, no thread and
# no sleep inside an m6 process's loop. Each permitted use carries
# #[expect(clippy::disallowed_methods, reason = "...")] naming why it is allowed
# or which job removes it. The list of expects only shrinks.
disallowed-methods = [
  { path = "std::thread::spawn", reason = "the event-loop rule: no thread per request" },
  { path = "std::thread::Builder::spawn", reason = "the event-loop rule: no thread per request" },
  { path = "std::thread::scope", reason = "the event-loop rule: no thread per request" },
  { path = "std::thread::sleep", reason = "the event-loop rule: no sleep in a loop, use a deadline" },
  { path = "std::sync::mpsc::Receiver::recv_timeout", reason = "the event-loop rule: wait on a descriptor" },
  { path = "std::net::TcpStream::connect", reason = "the event-loop rule: connect through the reactor" },
  { path = "std::net::TcpStream::connect_timeout", reason = "the event-loop rule: connect through the reactor" },
  { path = "std::os::unix::net::UnixStream::connect", reason = "the event-loop rule: connect through the reactor" },
  { path = "std::net::TcpStream::set_read_timeout", reason = "the event-loop rule: a deadline, not a socket timeout" },
  { path = "std::net::TcpStream::set_write_timeout", reason = "the event-loop rule: a deadline, not a socket timeout" },
  { path = "std::os::unix::net::UnixStream::set_read_timeout", reason = "the event-loop rule: a deadline, not a socket timeout" },
  { path = "std::os::unix::net::UnixStream::set_write_timeout", reason = "the event-loop rule: a deadline, not a socket timeout" },
]
