[package]
name    = "m6-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "m6_core"

[features]
# The shared integration-test harness. Off by default so no production binary
# links it; enable it from a crate's [dev-dependencies] entry.
testkit = []

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
anyhow     = "1"
thiserror  = "1"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
tracing-appender   = "0.2"
nix        = { version = "0.27", features = ["signal"] }
httparse   = "1"
httpdate   = "1"
rand       = "0.8"
libc       = "0.2"
minify-html = "0.15"
minify-js   = "0.5"
brotli      = "6"
flate2      = "1"

[dev-dependencies]
tempfile = "3"
