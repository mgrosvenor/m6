global_params = ["data/site.json"]
secrets_file  = "/nonexistent/path/secrets.toml"

# One worker and no queue, so a request that blocks in a body read holds the
# whole pool and a probe is answered 503 while it does. That 503 is the signal
# a shutdown test waits on to confirm a request is in flight, rather than a
# fixed sleep.
[thread_pool]
size       = 1
queue_size = 0

[[route]]
path     = "/blog"
template = "templates/post-index.html"
params   = ["content/posts/_index.json"]
