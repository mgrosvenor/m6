global_params = ["data/site.json"]
secrets_file  = "/etc/m6/render-contact.toml"

# The form's POST is a code route, so this template route answers GET only.
[[route]]
path     = "/contact"
methods  = ["GET"]
template = "templates/contact.html"
params   = []
cache    = "no-store"

# DEVELOPMENT VALUES. In production these move to secrets_file and are deleted
# from here: a key set in both this file and the secrets file is refused at
# startup, naming the key, so each key has exactly one owner. Locally the owner
# is this file and /etc/m6/render-contact.toml does not exist, so the example
# needs no setup. In production, create the secrets file with the real values
# and remove the whole [smtp] section below. Leave no placeholder behind: an
# absent required key fails at start and says which key is missing.
[smtp]
host     = "localhost"
port     = 1025
# The local development relay speaks plain SMTP, which m6-core allows only to
# localhost. Production relays take STARTTLS on port 587: delete this line.
starttls = false
username = ""
password = ""
from     = "noreply@example.com"
to       = "owner@example.com"
