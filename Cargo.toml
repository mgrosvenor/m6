[workspace]
members = [
    "m6-core",
    "m6-auth",
    "m6-auth-cli",
    "m6-file",
    "m6-http",
    "m6-html",
    "m6-monitor",
    "m6-auth-server",
    "m6-md",
    # The two Rust backend examples, docs/m6-backend-examples.md. Workspace
    # members rather than standalone crates so the normal build compiles them,
    # the zero-warnings rule covers them, and clippy is held to silence on them
    # like everything else. An example that does not build is worse than no
    # example, because it is the thing people copy.
    #
    # They are a pair on purpose: same language, same compiler, same payload, so
    # the difference between them is exactly what linking m6-core costs.
    "m6-http/tests/backends/rust-plain",
    "m6-http/tests/backends/rust-m6core",
]
resolver = "2"

# Shared by every crate in the workspace, so they cannot drift apart. Each
# member inherits with `version.workspace = true` and friends.
#
# The version matches the newest tag. Bump it HERE, on develop, and do it FIRST:
# the develop -> main pull request that is the release reads this line to decide
# what CHANGELOG.md must mention, and to check the version is not already tagged. `./tag.sh v<version>` then tags the merge and does NOT touch
# this line.
#
# This said `tools/release.sh` until 2026-09-26, and that script was deleted on
# 2026-09-14 when a pull request became the only way from develop to main. Issue
# #118: the same deleted name was in both of the pre-push hook's tag refusals and
# in the pull request template. It is the shape to watch for, because all four
# sites are read at exactly one moment -- while cutting a release -- and none of
# them is read at any other time, so being wrong costs nothing until it costs
# something. An earlier comment here also claimed that script bumped this line,
# which it did not; that claim was likewise only ever tested at a release.
#
# Before any of this the tag said v0.2.0 and every crate said 0.1.0.
#
# 1.0.0 WAS CUT ON 2026-09-14. The consolidation work it was waiting on is done:
# clippy at zero, h3 measured and understood, phase 8's six backend examples and
# the m6-core overhead measurement they existed for, and the advisories resolved.
#
# Phase 7 (the renderers pinned to a tag rather than a path) is sequenced AT the
# release, because it needs a tag to pin to. See CHANGELOG.md's 1.0.0 entry for
# what is knowingly not fixed.
[workspace.package]
version      = "1.11.3"
edition      = "2021"
# The oldest toolchain we test. Declared because declaring one and not testing
# it is a claim rather than a fact: CI builds the whole workspace with exactly
# this version, and that is how this number was found rather than guessed. The
# guess was 1.85, on the basis that `is_none_or` (1.82) is the newest standard
# library call we make. CI answered with the real constraint, which is the
# dependencies: globset and the icu_* crates require 1.88.
rust-version = "1.88"
license      = "BSD-3-Clause"
authors      = ["Matthew P. Grosvenor"]
repository   = "https://github.com/mgrosvenor/m6"

# ── Release profile ─────────────────────────────────────────────────────────
#
# This section did not exist until 2026-09-27, so every release ever built took
# cargo's defaults: opt-level 3 and no debug assertions, which is a real release
# build, with lto off, codegen-units at 16, symbols kept and overflow checks off.
#
# WHY IT MATTERS HERE MORE THAN MOST. m6-file's dependency graph is 222 crates
# and m6-http's is 285. With lto off, nothing is eliminated across a crate
# boundary, so each binary carries code no path reaches. The binaries were 25 to
# 29 MB, and a node runs five m6 services plus a site's renderers at once. That
# is resident memory and instruction cache the request path is competing with.
#
# `cargo install --git` uses THIS file's profile, not the installing
# repository's, which is how the deployment repository ended up with the full
# profile for its three renderers while the seven m6 binaries had none.
[profile.release]
opt-level     = 3          # cargo's default, written down so it cannot drift
lto           = "fat"      # across all 222 crates, not just within one
codegen-units = 1          # 16 splits the crate and blocks inlining across the splits
strip         = "symbols"  # 3.6 MB per binary, measured
panic         = "abort"    # no unwind tables. `catch_unwind` here is #[cfg(test)] only

# OVERFLOW CHECKS ARE ON IN RELEASE, deliberately, at a few percent.
#
# Owner's decision, 2026-09-27: "Why use rust without them?"
#
# The argument is in CHANGELOG.md under F-005. An external report described
# unbounded HTTP/2 flow-control arithmetic as "wraps and stalls". Its proof of
# concept did not wrap, it PANICKED, because the unchecked `+=` on an `i32` is
# checked in a debug build. Release wrapped silently, and nothing detected it.
#
# Every integer in this workspace that a peer can influence sits in a
# hand-written protocol parser: window sizes, frame lengths, header list sizes,
# stream identifiers. A wrap there is a security bug that presents as a stall.
# An abort is a denial of service on one connection and is visible.
overflow-checks = true
